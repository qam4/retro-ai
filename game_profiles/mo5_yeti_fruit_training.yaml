# Yeti — fruit-only reward (no snowball farming incentive)
# Uses reward_mode: survival (no score reward) + fruit collection from C++

game_profile: yeti_fruit
algorithm:
  name: PPO
  learning_rate: 0.0003
  batch_size: 64
  extra:
    n_steps: 128
    n_epochs: 4
    ent_coef: 0.01

total_timesteps: 5000000
num_envs: 8
device: auto
mixed_precision: false
vec_env_type: threaded

grayscale: true
resize: [84, 84]
frame_stack: 4
frame_skip: 4
frame_maxpool: true

output_dir: output/mo5/yeti/training/ppo_5M_fruit
tensorboard: true
checkpoint_interval: 25000
max_checkpoints: 4
log_interval: 1000

survival_bonus: 0.01
