# Satellite Attack v2 — re-run with latest videopac (scanline + skip-render)
# Previous best: 22.0 score at ~300k steps with survival bonus

game_profile: satellite_attack_memory
algorithm:
  name: PPO
  learning_rate: 0.0003
  batch_size: 64
  extra:
    n_steps: 128
    n_epochs: 4
    ent_coef: 0.01

total_timesteps: 500000
num_envs: 8
device: auto
mixed_precision: false
vec_env_type: threaded

grayscale: true
resize: [84, 84]
frame_stack: 4
frame_skip: 4
frame_maxpool: true

output_dir: output/videopac/satellite-attack/training/ppo_500k_v2
tensorboard: true
checkpoint_interval: 25000
max_checkpoints: 4
log_interval: 1000

survival_bonus: 0.01
max_episode_steps: 900
