args:
  config_path: experiments/003-yeti/configs/yeti_curriculum_v1.yaml
extras:
  training:
    timesteps: 5000000
    output: output/mo5/yeti/training/yeti_curriculum_v1
    num_envs: 8
    seed: 42
    resume: output/mo5/yeti/training/yeti_universal_v3/final_model.zip
  env:
    profile: yeti_fruit
    action_mode: joystick
    max_steps: 1000
    stall_threshold: 15
    resize:
    - 84
    - 84
    frame_skip: null
    frame_stack: null
    frame_maxpool: null
    grayscale: null
  reward:
    name: fruit_bonus_path_progress_universal
    params:
      scale: 0.01
      fruit_scale: 0.01
      princess_scale: 0.05
  ppo:
    learning_rate: 0.0003
    batch_size: 64
    n_steps: null
    n_epochs: 4
    ent_coef: 0.01
    clip_range: 0.2
    gamma: 0.99
    gae_lambda: 0.95
  curriculum:
    reset_fraction: 0.6
    frontier_fraction: 0.4
    earlier_fraction: 0.0
    max_states_per_checkpoint: 100
    min_states_to_advance: 20
    seed_archive: null
  resolved_seed: 42
  script: scripts/train_checkpoint_curriculum.py
