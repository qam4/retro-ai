args:
  config_path: experiments/003-yeti/configs/yeti_curriculum_l2_v9_wpgroup_15m.yaml
extras:
  training:
    timesteps: 15000000
    output: output/mo5/yeti/training/yeti_curriculum_l2_v9_wpgroup_15m
    num_envs: 8
    seed: 42
    resume: output/mo5/yeti/training/yeti_curriculum_l2_v8_anneal_10m/final_model.zip
    snapshot_freq_steps: 100000
    warmstart_weights_only: true
  env:
    profile: yeti_fruit_level2
    action_mode: joystick
    max_steps: 1000
    stall_threshold: 40
    resize:
    - 84
    - 84
    frame_skip: null
    frame_stack: null
    frame_maxpool: null
    grayscale: null
  reward:
    name: fruit_bonus_path_progress_pbrs_grounded
    params:
      scale: 0.01
      fruit_scale: 0.01
      princess_scale: 0.05
      level: 2
      gamma: 1.0
  ppo:
    learning_rate: 0.0003
    batch_size: 64
    n_steps: 512
    n_epochs: 4
    ent_coef: 0.01
    clip_range: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    target_kl: 0.05
  curriculum:
    reset_fraction: 0.0
    frontier_fraction: 0.0
    earlier_fraction: 0.0
    max_states_per_checkpoint: 100
    min_states_to_advance: 20
    seed_archive: null
    preseed_pool: null
    reach_threshold: 0.15
    segment_floor: 0.0
    multi_input_obs: false
    min_survival_steps: 30
    fruits_total: 2
    fruit_presence_addrs:
      1: 11950
      2: 11975
    start_state: output/mo5/yeti/level2/level2_start.sav
    waypoints: true
    waypoint_tolerance: 2
  resolved_seed: 42
  script: scripts/mo5/yeti/train_checkpoint_curriculum.py
