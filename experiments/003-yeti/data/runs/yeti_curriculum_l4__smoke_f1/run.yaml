args:
  config_path: .kiro/tmp/f1_smoke.yaml
extras:
  training:
    timesteps: 150000
    output: output/mo5/yeti/training/yeti_curriculum_l4__smoke_f1
    num_envs: 8
    seed: 42
    resume: output/mo5/yeti/training/yeti_curriculum_l4_v23_ropebonus_warm_v13_6m/final_model.zip
    snapshot_freq_steps: 500000
    route_table_freq_steps: 50000
    warmstart_weights_only: true
    on_regression: 'off'
    regression_patience: 3
    resume_pools: output/mo5/yeti/pools/empty.pkl
  env:
    profile: yeti_fruit_level4
    action_mode: joystick
    max_steps: 1500
    stall_threshold: 40
    resize:
    - 84
    - 84
    frame_skip: null
    frame_stack: null
    frame_maxpool: null
    grayscale: null
    crop: null
  reward:
    name: fruit_bonus_path_progress_pbrs_grounded
    params:
      scale: 0.01
      fruit_scale: 0.01
      princess_scale: 0.05
      level: 4
      gamma: 1.0
      defer_fruit_credit: true
      waypoint_reward_tol: 2
      mark_airborne: true
      pay_on_target_change: true
      ladder_segment_shaping: true
      carry_pose_bonus: 1.0
      carry_pose_ids:
      - 15
  ppo:
    learning_rate: 0.0003
    batch_size: 64
    n_steps: 512
    n_epochs: 4
    ent_coef: 0.01
    clip_range: 0.2
    gamma: 0.99
    gae_lambda: 0.95
    target_kl: null
  curriculum:
    reset_fraction: 0.0
    frontier_fraction: 0.0
    earlier_fraction: 0.0
    max_states_per_checkpoint: 100
    min_states_to_advance: 20
    seed_archive: null
    preseed_pool: null
    reach_threshold: 0.15
    segment_floor: 0.0
    multi_input_obs: false
    min_survival_steps: 30
    fruits_total: 1
    fruit_presence_addrs:
      1: 11055
    start_state: output/mo5/yeti/level4/level4_start.sav
    waypoints: true
    waypoint_tolerance: 2
    gate_waypoints: true
    gate_waypoints_by_predecessor: true
    waypoint_reach_mode: sprite
    seed_waypoint_skip: []
    split_mandatory_starts: true
    earned_progress_score: true
    admit_requires_survival: true
    admit_requires_grounded: false
    noop_start_max: 0
    noop_start_scope: reset
  resolved_seed: 42
  script: scripts/mo5/yeti/train_checkpoint_curriculum.py
