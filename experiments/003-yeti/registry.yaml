# Yeti champion registry: which policy plays which game level, and how every
# evaluation of it is set up. Read by python/retro_ai/training/yeti_registry.py and by
# `scripts/mo5/yeti/eval_from_reset.py --policy ID --game-level N`.
#
# Each kind of setting has ONE home, and nothing here is copied from another:
#   levels    where a game level starts, which map layout it uses, its game profile,
#             fruit count and stop rules. Owned HERE.
#   policies  a model, its sha256, and the run that trained it. The policy's VIEW of the
#             game (resize, resize mode, crop, frame settings, action mode, reach test)
#             is read from that run's config and archived run record, never repeated.
#   results   NOT in this file. They are the JSON files the evaluator writes under
#             experiments/003-yeti/data/champion_recheck/<policy>/, read back with
#             their model and emulator hashes checked.
#
# Paths are relative to the repo root. Models and start saves are local files, not
# tracked (models are large; a .sav holds the game program).

levels:
  1:
    layout: 1           # yeti_map.LEVELS key
    start_state: null   # game reset
    # Respawns (31 snowball sequences, 10 held out). The referee scores L1 on the
    # held-out ones; the game reset is reported beside them, for information only.
    start_pool: experiments/003-yeti/data/respawns/l1_r1.json
    profile: yeti_fruit
    fruits_total: 4
    # L4's stop rules (were 1000 / 15), so L1 trains and is scored as every later
    # level is. l1_v17's 300 episodes ended by step 667 and none on a stall, so
    # neither number moved them; a result measured under the old rules is still a
    # different measurement and is not pooled with these (Registry.results).
    max_steps: 1500
    stall_threshold: 40
  2:
    layout: 2
    start_state: output/mo5/yeti/level2/level2_start.sav
    # Entries (l1_v22 finishing L1 at spread moments) and respawns (l2_v10).
    start_pool: experiments/003-yeti/data/start_pools/l2_p1.json
    profile: yeti_fruit_level2
    fruits_total: 2
    # L4's stop rules (max_steps was 1000), as on every other level. One of l2_v10's
    # 300 episodes from the level start hit the 1000 cap, so little should change; a
    # result measured under 1000 is still a different measurement and is not pooled.
    max_steps: 1500
    stall_threshold: 40
  3:
    layout: 3
    start_state: output/mo5/yeti/level3/level3_start.sav
    # Entries (l2_v10 finishing L2 at spread moments) and respawns (l3_v15).
    start_pool: experiments/003-yeti/data/start_pools/l3_p1.json
    profile: yeti_fruit_level3
    fruits_total: 1
    max_steps: 1500
    stall_threshold: 40
  4:
    layout: 4
    start_state: output/mo5/yeti/level4/level4_start.sav
    # Entries (l3_v15 finishing L3) and respawns (l4_v30). Only 5 route patterns:
    # L4's starts differ mostly in timing, which the grouping does not split on.
    start_pool: experiments/003-yeti/data/start_pools/l4_p1.json
    profile: yeti_fruit_level4
    fruits_total: 1
    max_steps: 1500
    stall_threshold: 40
  5:
    # L1's tiles exactly (0 of 1000 cells differ), 1.7-1.9x the snowballs. Captured by
    # playing L4 through its princess, so it carries a real playthrough's score, bonus
    # and lives. L1's profile and stop rules: same layout, and its bonus clock runs from
    # the first step like L1's (995 -> 958 on L1 vs 999 -> 962 on L5 over 40 no-op
    # steps, measured 2026-10-12). They moved with L1's to L4's.
    layout: 1
    start_state: output/mo5/yeti/level5/level5_start.sav
    # Entries (l4_v30 finishing L4) and respawns (l1_v22 playing L5).
    start_pool: experiments/003-yeti/data/start_pools/l5_p1.json
    profile: yeti_fruit
    fruits_total: 4
    max_steps: 1500
    stall_threshold: 40

policies:
  l1_v17:
    model: output/mo5/yeti/training/yeti_curriculum_l1_v17_v30recipe_cold_10m/best/best_model.zip
    model_sha256: 9c066df81e686de6ccc9ad5dc41b78d83959a2069bf7b02a5b310d4ee92015a6
    config: experiments/003-yeti/configs/yeti_curriculum_l1_v17_v30recipe_cold_10m.yaml
    run_record: experiments/003-yeti/data/runs/yeti_curriculum_l1_v17_v30recipe_cold_10m/run.yaml
  l2_v10:
    # The 7.3M snapshot; byte-identical to champions/l2_v10_7300k/final_model.zip.
    model: output/mo5/yeti/training/yeti_curriculum_l2_v10_deferfruit_10m/best/best_model.zip
    model_sha256: 351a4b2579ee685cd0101e7b1431ced51125cee7cf4c1b0f117319f40e1cc32e
    config: experiments/003-yeti/configs/yeti_curriculum_l2_v10_deferfruit_10m.yaml
    run_record: experiments/003-yeti/data/runs/yeti_curriculum_l2_v10_deferfruit_10m/run.yaml
  l3_v15:
    # FINAL weights: the only L3 v15 model measured at 300 episodes (242/300, older
    # evaluator, level3_notes.md "v15 FINAL"). The run's peak snapshot is not
    # identified yet; see TODO.md.
    model: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
    model_sha256: 8eac09c82c2a72dc09b443bd60b1f41e63389758858ddb6db7e4e0de9f576e6a
    config: experiments/003-yeti/configs/yeti_curriculum_l3_v15_gatewp_15m.yaml
    run_record: experiments/003-yeti/data/runs/yeti_curriculum_l3_v15_gatewp_15m/run.yaml
  l4_v30:
    model: output/mo5/yeti/training/yeti_curriculum_l4_v30_blockmax_cold_15m/best/best_model.zip
    model_sha256: d62f6d8683685328f38f8485cdf8a67aabfe9c8867ee9ec0ca05c400b8627a27
    config: experiments/003-yeti/configs/yeti_curriculum_l4_v30_blockmax_cold_15m.yaml
    run_record: experiments/003-yeti/data/runs/yeti_curriculum_l4_v30_blockmax_cold_15m/run.yaml
  l1_v22:
    # The 10M SNAPSHOT, not the referee's saved best (4.25M). Of the three snapshots
    # re-measured at 300 episodes from reset (stop 1500 / 40) it scored highest: 245
    # against 243 (4.25M) and 235 (7.5M). Taking the top of three is a mild selection,
    # and the three are within noise of each other. Its control, l1_v21 (the same
    # config without route_potential), scored 148-162 on its own three.
    model: output/mo5/yeti/training/yeti_curriculum_l1_v22_tour_cold_10m/snapshots/model_10000000_steps.zip
    model_sha256: 2cf3e9bb7d3b99fb36437c6399636c3b0ad0a3c08602eca316a87efe682e423f
    config: experiments/003-yeti/configs/yeti_curriculum_l1_v22_tour_cold_10m.yaml
    run_record: experiments/003-yeti/data/runs/yeti_curriculum_l1_v22_tour_cold_10m/run.yaml
  l4_v32:
    # The 2.25M snapshot, which is also the referee's saved best (same sha256). Trained
    # on L4's start pool, warm from l4_v30's final weights. Registry evals, 300 episodes
    # each: L4 held-out starts 124/300, all from entries (124/279; l4_v30 58/272), own
    # saved start 141/300 (l4_v30 220/300). A --config re-measure before registering
    # read 138 and 132. Its 2.75M and 3M snapshots read 111 and 42 held out, so the
    # run swings and this is the top of three.
    model: output/mo5/yeti/training/yeti_curriculum_l4_v32_startpool_warm_v30_6m/snapshots/model_2250000_steps.zip
    model_sha256: 6868ec527b424472b72e78b924d16ec097919cff85a07cd7c5586ec5d9395d13
    config: experiments/003-yeti/configs/yeti_curriculum_l4_v32_startpool_warm_v30_6m.yaml
    run_record: experiments/003-yeti/data/runs/yeti_curriculum_l4_v32_startpool_warm_v30_6m/run.yaml
  l4_v34:
    # The 13.5M snapshot, which is also the referee's saved best (same sha256). Cold, on
    # L4's start pool, with the first HUD line masked (env.mask_top_rows 7, taken from
    # the config by every registry eval). Registry evals, 300 episodes each: L4 held-out
    # starts 141/300, all from entries (141/280; respawns 0/20), own saved start
    # 150/300. A --config re-measure before registering read 144 and 164. The referee
    # read 18/30 held out, the best of 60 snapshots. Its unmasked twin l4_v33 never
    # reached the princess in a referee eval.
    model: output/mo5/yeti/training/yeti_curriculum_l4_v34_startpool_hudmask_cold_15m/snapshots/model_13500000_steps.zip
    model_sha256: 4a46f31d42c12685040f6e7e20084cd06ae816b17eb389e43c80016d40833e43
    config: experiments/003-yeti/configs/yeti_curriculum_l4_v34_startpool_hudmask_cold_15m.yaml
    run_record: experiments/003-yeti/data/runs/yeti_curriculum_l4_v34_startpool_hudmask_cold_15m/run.yaml

# The policy that plays each game level. L5 has none: l1_v17 scores 0/300 there.
# L1 moved from l1_v17 (219/300 under the current rules) to l1_v22 (245/300).
# L4 moved from l4_v30 to l4_v32 for the held-out starts (124/300 against 58/300),
# which a real game enters L4 through; it plays the one saved start worse (141 / 220).
# Then from l4_v32 to l4_v34: held-out 141/300 against 124/300, own start 150 against
# 141 (z +1.4 and +0.7, two-proportion; ahead on both, significant on neither), and it
# cannot read the score or the lives stars, which l4_v32 does (a respawn's stars pasted
# into its own start: 0/20).
champions:
  1: l1_v22
  2: l2_v10
  3: l3_v15
  4: l4_v34
