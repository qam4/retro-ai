# yeti_curriculum L2 v2 PROBE — short run to answer the gap-jump question
# cheaply before committing to a full 20M run.
#
# Identical to yeti_curriculum_l2_v2.yaml (nav-graph PBRS shaping, level 2)
# EXCEPT timesteps 20M -> 3M and a separate output dir. The shaping pulls the
# agent toward the fruits (floor 5); the FIRST thing it must do is cross the
# gaps on the top floor (F1) to reach a ladder down. If by ~3M the agent is
# descending (reset_reach[1] climbs above 0, or episodes reach lower floors /
# final_y past F2 y72), unaided gap-jumping works -> scale to 20M. If it stays
# pinned on the top floor, the gaps are the wall and we add explicit jump help.

training:
  timesteps: 3_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l2_v2_probe
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000

env:
  profile: yeti_fruit_level2
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 2

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 16
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_frames: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 2
  fruit_presence_addrs:
    1: 11950
    2: 11975
  start_state: output/mo5/yeti/level2/level2_start.sav
