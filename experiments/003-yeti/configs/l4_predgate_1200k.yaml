# L4 PREDECESSOR GATE — 1.2M. Gate a waypoint on its PREDECESSOR's reach, not its own.
#
# ONE LEVER: `curriculum.gate_waypoints_by_predecessor: true`. Everything else is
# byte-identical to l4_anchors_v2_1200k.yaml, so THAT RUN IS THE CONTROL.
#
# THE BUG THIS FIXES. `gate_waypoints` admits a waypoint as a start state once the agent
# reaches it from reset >= reach_threshold (0.15). At the FRONTIER that is self-locking:
# the frontier is by definition the point not yet reached, so its reach is ~0, so it is
# never sampled, so the skill is never practised, so its reach stays ~0.
#
# Measured in the control run (7140 episodes, start_key counts from episodes.csv):
#
#     Step           217 starts     from-reset reach 0.81
#     Lclimb3_top      0 starts     reach 0.02   pool 100
#     Low1             0 starts     reach 0.00   pool 100
#     Low2_launch      0 starts     reach 0.00   pool 100
#
# Three pools of 100 usable seeds each, sampled zero times in a 1.2M-step run. And they
# ARE usable -- seeded there directly with the control's 800k policy, 30 episodes each:
#
#     from Lclimb3_top:  floor 11 0.90   floor 12 0.17
#     from Low1:         floor 12 0.90   floor 13 0.00
#     from Low2_launch:  floor 12 0.50   floor 13 0.00
#
# WHY reach is 0.02 rather than 0.81. Arriving at the ladder-3 head (floor 11, y 78,
# px 272) is lethal on a TIMER, not structurally. 37/40 episodes from the `Step` pool die
# on the ladder with the death flag flipping the frame y reaches 78. Scripted sweep of the
# departure time from the base (debug/l4_ladder3_timing.py):
#
#     hold NOOP after arriving :  0/41 waits survive
#     hold LEFT                : waits 14..22 survive
#     hold RIGHT               : waits 11..28 survive
#
# So there is a ~18-frame safe window in a deterministic cycle, and departures 0..10 die
# during the climb whatever happens next. That is a learnable timing skill, and it is the
# only thing between this run and rung 11. It cannot be learned from a pool that is never
# sampled.
#
# WHY NOT JUST LOWER THE THRESHOLD. The gate exists for a reason (L3: ungated drilling of
# unreachable states produced skill that did not compose to reset, 0.03%, while spending
# ~40% of episodes). Gating on the PREDECESSOR keeps that protection -- a point whose
# predecessor is also unreached stays shut, so the frontier opens exactly one rung at a
# time. `Lclimb3_top` opens because `Step` is 0.81; `Low1` stays shut until `Lclimb3_top`
# itself clears 0.15.
#
# PASS: `Lclimb3_top` appears in the episodes.csv start_key counts at all (the mechanism
#       works), AND its from-reset reach rises above the control's 0.02.
# FAIL: still 0 starts (the gate is not the binding constraint), or reach stays ~0.02
#       while starts are non-zero (the skill is not learnable from these seeds).
#
# READ IT AT MATCHED HEALTHY STEPS. The control collapses to from-reset reward ~3 from
# 900k onward and never recovers before 1.2M; compare at 600-850k where both are healthy,
# and treat any endpoint reading as uninformative (see method rule 6).
#
# CANNOT tell us about the floor 12 -> 13 crossing, which is 0/60 from the Low1 and
# Low2_launch pools and is the NEXT wall behind this one.
training:
  timesteps: 1_200_000
  output: output/mo5/yeti/training/l4_predgate_1200k
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 200_000
  route_table_freq_steps: 50_000
  # v4's weights AND v4's pools (checkpoints.pkl is loaded from dirname(resume)).
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v4_15m/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
