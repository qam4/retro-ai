# ============================================================================
# L3 v16 -- CONTROL for l3_v17. WARM from l3_v15 (the L3 champion), 6M, seed 42, L3
# from its level start only.
#
# l3_v15's config continued on the L4 settings the weights can carry:
#   reach test   curriculum.waypoint_reach_mode sprite (l3_v15 trained with box, the
#                only test before c666500), as on L1 and L4.
# Stop rules (1500 / 40), death flag and native stall were already L4's: the L3 and L4
# game profiles differ only in their names. The resize mode stays l3_v15's "nearest":
# shown L4's "max", l3_v15 died in 20/20 episodes from its own start (246/300 under
# nearest), so a warm start cannot take it.
#
# Everything else -- reward, PPO, curriculum -- is l3_v15's; weights-only warm start
# from the registered model (final_model.zip) and l3_v15's final pools. It measures
# what 6M more steps do on their own, so l3_v17's start pool is the only difference
# between the two.
#
# READ IT ON, best snapshots re-measured at 300 episodes: on L3's held-out starts
# (l3_v15: 0/300, no fruit in any episode) and from the level start (l3_v15: 246/300).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v16_l4rules_warm_v15_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  waypoint_reach_mode: sprite
