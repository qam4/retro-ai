# yeti_curriculum L2 v8 — PHASE-2 ANNEAL warm-started from the v7 14M champion.
#
# v7 (WP curriculum, n_steps=16) achieved the milestone: from cold reset the
# best snapshots (13.5M/14M) reach floor 5 + BOTH fruits 100%. But the policy
# OSCILLATES (n_steps=16 / no target_kl = L1's H-V destructive-update swing):
# the from-reset both-fruits capability appears only in a narrow ~13.5-14.4M
# window (17%<->100%) and the final model collapses to floor 1. And it never
# touches the princess — it dies grabbing fruit 2 (on a gap edge) by jumping
# too early and falling.
#
# This is EXACTLY the L1 situation that phase-2 anneal (H-V) fixed (58%->99.7%):
# warm-start a swept champion's WEIGHTS, then SHRINK THE STEP (n_steps 16->512,
# target_kl=0.05) so updates are KL-bounded and stop destroying the policy.
# Small stable steps should (a) stabilize the oscillation and (b) refine the
# frame-precise fruit-2 grab-and-land. The WP curriculum stays ON (it inherits
# all 16 captured waypoints via the champion's checkpoints.pkl, incl. L56 /
# floor-5-right, which supplies the princess-reward gradient beyond fruit 2 so
# the agent can backward-chain SURVIVING the fruit-2 jump).
#
# Warm-start: weights-only from the champion (keeps THIS run's n_steps=512 /
# target_kl=0.05); the CP+WP pools + goal-scores load from the champion's
# checkpoints.pkl (dir of `resume`).

training:
  timesteps: 10_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l2_v8_anneal_10m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  resume: output/mo5/yeti/champions/l2_v7_14M/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level2
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 2
    gamma: 1.0

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.05

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 2
  fruit_presence_addrs:
    1: 11950
    2: 11975
  start_state: output/mo5/yeti/level2/level2_start.sav
  waypoints: true
  waypoint_tolerance: 2
