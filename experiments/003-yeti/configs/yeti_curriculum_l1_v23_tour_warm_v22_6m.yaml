# ============================================================================
# L1 v23 -- CONTROL for l1_v24. WARM from l1_v22 (the L1 champion, its 10M snapshot),
# 6M, seed 42, L1 from the game reset only.
#
# l1_v22's config continued: same reward (tour potential), settings, PPO and
# curriculum; weights-only warm start from the registered snapshot and v22's final
# pools. It measures what 6M more steps do to l1_v22 on their own, so l1_v24's
# respawn pool is the only difference between the two -- the v18 / v19 pairing again.
#
# READ IT ON, best snapshots re-measured at 300 episodes: from reset (l1_v22 232/300
# and 245/300) and on the held-out respawn sequences (l1_v22 0/300, 44 with all four
# fruits).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l1_v23_tour_warm_v22_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l1_v22_tour_cold_10m/snapshots/model_10000000_steps.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l1_v22_tour_cold_10m/checkpoints.pkl
env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max
reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 1
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    route_potential: true
ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 4
  fruit_presence_addrs:
    1: 12205
    2: 12032
    3: 11880
    4: 11736
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
