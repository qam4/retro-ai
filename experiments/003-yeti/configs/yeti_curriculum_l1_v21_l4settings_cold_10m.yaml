# ============================================================================
# L1 v21 -- COLD CONTROL on L4's settings, 10M, seed 42.
#
# l1_v17's config (the v30 recipe on L1) with only the stop rules moved to L4's:
# max_steps 1000 -> 1500, stall_threshold 15 -> 40. The profile supplies the rest of
# L4's settings since af875ac (0x2AFC death, bonus_stall_frames 120). l1_v17 itself
# is not a control for v22: it trained on the old death detection and stop rules.
#
# THE PAIR. v22 is this config plus `route_potential: true`, nothing else. Cold, so
# neither run inherits l1_v17's route (F1 -> F3 -> F4 -> F2, which the sum-of-distances
# potential pays for); warm starts would test whether a learned route can be unlearned,
# a different question.
#
# READ IT ON, best snapshots re-measured at 300 episodes from reset: princess rate,
# and the fruit ORDER of the episodes that take all four (eval_from_reset's
# fruit_order_counts). One run per arm, so a princess difference under ~2 standard
# errors is not resolved; the route is read per episode.
# ============================================================================
training:
  timesteps: 10_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l1_v21_l4settings_cold_10m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max
reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 1
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 4
  fruit_presence_addrs:
    1: 12205
    2: 12032
    3: 11880
    4: 11736
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
