# ============================================================================
# L3 v24 -- SPRITE REACH WITH A3'S ANCHOR MEASURED. WARM from l3_v15, 6M, seed 42.
#
# Byte-identical to yeti_curriculum_l3_v18_l4rules_creditfix_warm_v15_6m.yaml except
# `output`. The ONE lever is in CODE: LEVEL3.jump_waypoint_pos = {"A3": (31, 62)}.
#
# WHY. Under sprite reach L3 lost the princess from its level start for good (l3_v16
# 4.69M, l3_v18 3.80M below 0.05) and under box it recovered (l3_v21, box reach only:
# longest dip 1.04M, 211/300 at 6M). Sprite read A3 at 0.07-0.12 from reset while A4,
# after it, read 0.70-0.72: the A2 -> A3 crossing (40/40 identical in l3_v15's
# princess episodes) never covers the derived edge anchor, x 32. So A3's milestone was
# never marked (its distance kept pulling back) and its pool stayed gated shut. At
# x 31 sprite catches it in 40/40 l3_v15 princess episodes (anchor review, 2026-10-24).
#
# NOT SHOWN: that A3 caused the collapse. Every lasting collapse began upstream of A3
# (escalator exit, SN3 -> A1, Lsc1 -> Lsc2). Under box, the reward never marked A2 or
# A5 either and l3_v15 still won. This run tests it.
#
# READ IT ON: the princess EMA from the level start (spells below 0.05, against
# l3_v18's 3.80M to the end and l3_v21's 1.04M), A3's reach in the route table (now
# expected near A4's), and a 300-episode re-measure of the final snapshot from the
# level start (l3_v18 0/300, l3_v21 211/300, l3_v15 246/300).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v24_a3anchor_warm_v15_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  waypoint_reach_mode: sprite
