# 50k-step smoke test of curriculum_v9_seeded.yaml.
# Purpose: verify end-to-end pipeline (new archive format loads, new
# reward works) before launching the full 10M run.

training:
  timesteps: 50_000
  output: output/mo5/yeti/training/curriculum_v9_seeded_smoke
  num_envs: 8
  seed: 42

env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]

reward:
  name: fruit_princess_bonus
  params:
    fruit_scale: 0.01
    princess_scale: 0.05

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.4
  frontier_fraction: 0.4
  earlier_fraction: 0.2
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  seed_archive: output/mo5/yeti/go_explore_v9/archive.pkl
