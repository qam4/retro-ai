# L4 ALLOCATION CHECK (GH) -- 60k, warm-started from v2.
#
# Not a training experiment. The question is only whether the flag CHANGES THE START
# DISTRIBUTION on L4, because on L3 earned_progress_score turned out to be inert:
# its start shares matched baseline to within a point, so its results there were
# baseline noise and told us nothing.
#
# The inversion it targets is an L4 phenomenon: Step (the stuck frontier) scored 0.643
# and got the LOWEST weight of any eligible start, while the already-solved Lfruit_top
# scored 0.549. Read Step's share of starts; if it does not move, the flag is inert
# everywhere and we drop it.
training:
  timesteps: 60_000
  output: debug/l4alloc_GH
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 1_000_000
  route_table_freq_steps: 20_000
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v2_15m/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  # Single fruit, so the remaining-counter IS the presence predicate.
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  split_mandatory_starts: true
  earned_progress_score: true
