# L4 v9 PROBE — 100k. Does admitting the LEFT-WALK poses change what gets detected?
#
# THE LEVER, and it is one line: poses 6 and 7 join SURFACE_POSES.
#
# The walk animation is FOUR poses per direction, but only the rightward cycle (0-3) had
# ever been catalogued; 6 and 7 are the second half of the LEFTWARD cycle. Measured by
# holding a direction and logging pose against the per-step lateral delta at the floor's
# standing y, on 4 L4 floors:
#
#     0,1,2,3  dx in {0, +4}   walk RIGHT, grounded   all were in SURFACE_POSES
#     4,5,6,7  dx in {-4, 0}   walk LEFT,  grounded   6 and 7 were NOT
#
# That gate drives waypoint detection, seed capture, reward milestone marking and floor
# crediting, so ~54% of grounded frames on any LEFTWARD approach were discarded (against
# 0% rightward). L4's closing stretch is entirely leftward -- rope 2 crosses floor
# 12 -> 13 leftward, and floor 13 to the princess ladder is leftward -- so the gap sat on
# exactly this level's wall. v8 logged 1857 such discarded frames per 100k.
#
# PASS looks like:
#   1. `grounded frames NOT counted as surface` is ABSENT from the status line. v8 showed
#      `left-walk frames not counted as surface: 1857`. Non-zero now would mean some
#      OTHER grounded pose is still missing.
#   2. Capture counts rise on leftward waypoints -- Low2_launch and Low2 especially, since
#      the approach to both is leftward. Compare the route table's cap/rej column against
#      debug/l4_v8_probe/output.log at the same step.
#   3. Pools stay clean: debug/l4_pool_purity.py should still read 100% on-surface. This
#      lever admits MORE frames, so it is worth confirming it does not admit bad ones.
#
# NOT the point: princess, depth, or reach. 100k is far too short, and reach is doubly
# unreadable here -- v8 already changed the tolerance, and this changes the pose gate, so
# the metric has moved twice. Do not compare route numbers to any earlier run.
#
# WHY THIS IS ITS OWN RUN. It is a reward change: more frames can mark a milestone, so the
# potential's trajectory differs and the warm-started critic is fit to the old signal.
# Stacking it on the v8 geometry change would make either result unattributable.

training:
  timesteps: 100_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v9_leftwalk_100k
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 50_000
  route_table_freq_steps: 25_000
  # v6's weights AND v6's pools (checkpoints.pkl is loaded from dirname(resume)).
  # That pool file was backfilled with anchor provenance by
  # debug/yeti_stamp_pool_anchors.py, which is what lets the two drops above fire --
  # it was written before the field existed, so otherwise it cannot be checked.
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v6_anchorfix_15m/best/best_model.zip
  warmstart_weights_only: true
  # The champion lives in best/ but the pools live in the run root, so this MUST be
  # given explicitly -- otherwise the pool load silently misses and the run starts with
  # empty pools, which would look like the fix working when nothing was inherited at all.
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l4_v6_anchorfix_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
