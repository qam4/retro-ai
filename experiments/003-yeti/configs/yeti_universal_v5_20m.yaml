# yeti_universal v5 — H-C: compute test (20M steps from reset).
#
# EXACTLY the v4 baseline (plain PPO from reset, leak-fixed reward,
# seed 42, same hyperparameters). The ONLY change vs v4 is the step
# budget: 5M -> 20M.
#
# Hypothesis (from approach 28): the F2->F3 wall is long-horizon
# exploration, and a from-reset policy might eventually stumble onto the
# F2->right->L23->F3 trajectory given ~4x the compute. v4 reached F3
# ~0.07% of reset episodes in 5M; if that rate climbs with more steps,
# raw exploration budget is (part of) the answer. If 20M still never
# reliably reaches F3, exploration-by-noise is ruled out and we need a
# targeted mechanism (H-D).
#
# Baseline to beat: v4 (reach-2 ~99-100%, reach-3 ~0.07% in training).
# Single change only.

training:
  timesteps: 20_000_000
  output: output/mo5/yeti/training/yeti_universal_v5_20m
  num_envs: 8
  seed: 42

env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_universal
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 1.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
