# yeti_curriculum L2 v4 — reward fix: pose-gated (airborne-freeze) + gamma=1.
#
# Identical recipe to v3 (phase-1 exploration, PBRS path-progress over the
# level-2 nav graph) EXCEPT two isolated reward changes, both validated on
# fixed trajectories before this run (see experiments/003-yeti-training.md
# "run 3"):
#   1. reward.name -> fruit_bonus_path_progress_pbrs_grounded
#      Freezes shaping while the player sprite pose (0x2B54) is airborne/
#      falling (not in the surface set {0-5 walk, 8 ladder}). Kills the
#      fall-into-gap reward at all ~14 gaps; ladder descents still credit.
#      last_floor is preserved.
#   2. reward.params.gamma: 1.0  (v3 defaulted to ppo.gamma=0.99, which paid
#      ~+0.098/step for idling — the whole ~+37 reward. L1 champions set 1.0.)
#
# Shorter (3M) first run to check for regressions / early signal before a
# full run. Everything else byte-identical to v3.

training:
  timesteps: 3_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l2_v4_grounded_3m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000

env:
  profile: yeti_fruit_level2
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 2
    gamma: 1.0

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 16
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 2
  fruit_presence_addrs:
    1: 11950
    2: 11975
  start_state: output/mo5/yeti/level2/level2_start.sav
