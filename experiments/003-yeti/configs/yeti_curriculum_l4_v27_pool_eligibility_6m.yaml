# v27 — 6M, seed 42. ONE lever: the start-gate reach universe.
#
# Same parent (v23/final_model.zip) and same empty-pool start as v24, so v24's 56-eval
# referee curve is the control arm.
#
# THE BUG THIS FIXES. `_wp_eligible` decides whether a pool may seed an episode by
# looking its from-reset reach up in `wp_reach_ema`. That table was built over the
# POSITIONAL DETECTOR universe (30 ids on L4) while the gate judges the START-POOL
# universe (17). A pool in the second but not the first gets no row, reads 0.0, fails the
# reach gate, falls through to the `route_order` predecessor rule, is absent from that
# too, and is refused forever.
#
# On L4 the two sets differ by exactly `F1`, the fruit pool created when fruit seeds
# moved out of the rung-keyed checkpoint slots. Measured:
#
#     v24  fruit seeds in checkpoint slot '3'  ->  925 starts / 24121 episodes (3.8%)
#     v26  same seeds in the F1 waypoint pool  ->    0 starts / 28137 episodes
#          F1 held 100 seeds, logged 10439 captures, sampled zero times
#
# Knock-on: the deep half of the route fell from 24.3% to 14.6% of all starts and
# per-waypoint from-reset reach dropped a flat 0.08-0.12 across the whole route. That
# flat offset is what v25 and v26 were both measuring, and it is why neither told us
# anything about the levers they were supposed to test.
#
# THE FIX is one call site: the reach table is now keyed by what is gated (detectors
# UNION start pools) and fed the fruit-inclusive reached set, so F1 gates itself on its
# own evidence -- ~0.98 from reset. The `route_order` predecessor fallback is never
# consulted for it, so `route_order` and the evaluator's frontier scoring are untouched
# and scores stay comparable with v23-v26. Nothing here is fruit-specific: any pool named
# other than a positional waypoint is now tracked instead of silently frozen out.
# test_start_pool_reach_universe.py pins it.
#
# ALSO IN THIS TREE, both measured and neither expected to matter:
#   * rewards.SURFACE_POSES matches yeti's (poses 6/7, the leftward walk). Priced on 12
#     recorded episodes replayed through both versions: IDENTICAL totals to 3 decimals.
#     At gamma 1.0 the PBRS sum telescopes, so the gate only moves WHEN credit lands.
#   * LEVEL4.edge_inset reverted to 0 after v25 measured it harmful: at 4 it flipped the
#     last step onto the departure edge from +0.04 to -0.04 at all 12 L4 jump edges.
#
# PREDICTION, so this run can be wrong: if the diagnosis holds, v27 lands near v24's
# mean Low2_launch rate of 0.349 rather than v25/v26's 0.195/0.209, and F1 takes roughly
# 3-4% of starts. If v27 still reads ~0.20 with F1 being sampled, the deficit is
# something else and the fruit pool was not it.
#
# STOP RULE: off. This is an A/B and stopping truncates the curve being compared.
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v27_pool_eligibility_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  route_table_freq_steps: 50_000
  # v13's weights AND v13's pools (checkpoints.pkl is loaded from dirname(resume)) —
  # byte-identical to v18's warm start.
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v23_ropebonus_warm_v13_6m/final_model.zip
  # NO INHERITED SEEDS. Points at a deliberately empty pool file so the policy comes
  # across warm while every pool rebuilds from this run's own captures. Reasons: 140 of
  # 1790 inherited seeds (8%) sit at positions today's sprite test rejects -- including
  # ALL of Hi5 and Hi1_launch and 10 of the 11 Low2 states, captured under v13's box
  # geometry with the jump tolerance of 6 -- and rung numbering has changed, so a rung
  # recorded in an old seed no longer means the same thing.
  resume_pools: output/mo5/yeti/pools/empty.pkl
  warmstart_weights_only: true
  # OFF for this run: it is an A/B and stopping truncates the curve being compared.
  # See the STOP RULE note in the header. QUOTED deliberately -- YAML 1.1 reads a bare
  # `off` as the BOOLEAN False, so the field would stop being the documented enum
  # ("off" | "stop", with "revert" to come). It happens to behave correctly today
  # because the trainer compares str(value) == "stop", but a bare `on` would become
  # True and any future three-way comparison on this field would misfire.
  on_regression: "off"

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    # THE LEVER vs v21. Flat +1.0, once per episode, for the leftward rope carry
    # (pose 15) -- the manoeuvre rope 2 is made of. Derivation in level4_notes.md
    # "ROPE 2 IS AN EXPECTED-VALUE PROBLEM": walking off the edge banks +0.075 CERTAIN
    # while attempting the rope is ~1%% x 2.940 = +0.029 expected and 0.000 on a miss,
    # so the agent correctly takes the worse outcome. +1.0 flips that (13x the
    # cliff-walk) and still leaves a completed crossing worth 4x a grab (+3.94).
    carry_pose_bonus: 1.0
    carry_pose_ids: [15]

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  # THE LEVER. v18 used 0.02, as did every other L4 run. Both reliably-finished levels
  # used 0.01.
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
