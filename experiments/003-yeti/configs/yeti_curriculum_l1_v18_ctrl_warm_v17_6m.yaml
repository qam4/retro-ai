# ============================================================================
# L1 v18 -- CONTROL for yeti_curriculum_l1l5_v1_warm_v17_6m. WARM from l1_v17, 6M, seed 42,
# L1 only.
#
# Identical to l1l5_v1 except `curriculum.start_groups` is absent (one group, L1 from a
# game reset). It separates "training on L5 cost L1" from what 6M more steps of L1
# training does to l1_v17 on its own, which nothing has measured: on this project the
# tail of a run has never produced the champion (003-yeti-training.md "Step 2").
#
# READ IT ON the best snapshot, 300 episodes on L1 AND on L5 (L5 through
# eval_from_reset --config, since this run does not train there): L1 against l1l5_v1's
# L1, and whether L1-only training moves L5 at all (l1_v17: 0/300).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l1_v18_ctrl_warm_v17_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l1_v17_v30recipe_cold_10m/best/best_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l1_v17_v30recipe_cold_10m/checkpoints.pkl
env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]
  resize_mode: max
reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 1
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 4
  fruit_presence_addrs:
    1: 12205
    2: 12032
    3: 11880
    4: 11736
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
