# IS v6 REPRODUCIBLE? bc85424's code, v6's config, SEED 43.
#
# Run with the WORKTREE at bc85424, not this checkout:
#   env PYTHONPATH=/tmp/wt_a0/python:build/ci-linux RETRO_AI_ROM_DIR=roms \
#     python3 /tmp/wt_a0/scripts/mo5/yeti/train_checkpoint_curriculum.py --config <this>
#
# WHY THIS BEFORE ANY BISECT. v6 is the only run that ever learned the floor 11 -> 12
# crossing, and every later run fails it:
#
#     P(reach Low1 | reached Lclimb3_top), from reset
#         v6    5158/5533 = 0.93
#         v12     14/7757 = 0.00      (and 0.08 even in SEEDED episodes)
#
# Measured anchor-free by floor occupancy from each run's own Lclimb3_top pool, 25 eps:
#
#     step      v12 len/f12      v6 len/f12
#     1.0M       55 / 0.56        57 / 0.68     <- equal here
#     1.4M       27 / 0.36        74 / 0.96
#     2.6M       47 / 0.52       119 / 0.72
#    14.0M       67 / 0.44        95 / 0.88     <- v6 learned it, v12 never did
#
# So current code CAN cross (0.56 at 1.0M) but never improves, while v6 climbs to 0.88
# and its episodes get 2x longer. That is a LEARNING failure, not detection (verified),
# not the seed pools (v6's and v12's Lclimb3_top pools are near-identical: pose 8/0 at
# px 272, and 0/100 survive standing still in BOTH, as expected with the floor-11 enemy)
# and not capability.
#
# BUT v6 IS n=1. Its own Low2 only ever hit 0.02, and this file's method section (rule 6)
# records that the from-reset reward collapses to ~3 and recovers in every arm, so single
# runs on L4 are unreliable. If v6's crossing does not reproduce on a fresh seed then
# there is NO regression to bisect and four candidate levers (poses 6/7, 7b27d49, the
# censused anchors, the predecessor gate) are all red herrings.
#
# SEED 43 deliberately. Rerunning seed 42 on identical code reproduces v6 and measures
# nothing.
#
# PASS: floor-12 occupancy from the Lclimb3_top pool climbs above ~0.8 and Low1 reach
#       tracks Lclimb3_top within a few points, as v6's did -> v6 is robust, bisect next.
# FAIL: it hovers at 0.3-0.6 like v12 -> v6 was a lucky seed, and the "regression" is
#       variance. Then the real problem is that this crossing is learned unreliably,
#       which is a different and better-posed problem.
training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/l4_v6repro_s43_15m
  num_envs: 8
  seed: 43
  snapshot_freq_steps: 100_000
  route_table_freq_steps: 50_000
  # v4's weights AND v4's pools (checkpoints.pkl is loaded from dirname(resume)).
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v4_15m/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
