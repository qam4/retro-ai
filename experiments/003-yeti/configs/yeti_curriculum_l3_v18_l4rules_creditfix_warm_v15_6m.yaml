# ============================================================================
# L3 v18 -- l3_v16 RE-RUN on the start-credit fix (ce6bfbb). WARM from l3_v15, 6M,
# seed 42, L3 from its level start only.
#
# Byte-identical to yeti_curriculum_l3_v16_l4rules_warm_v15_6m.yaml except `output`.
# The difference is in CODE: an episode is now credited to the start pool it was drawn
# from. In l3_v16 the inherited rung-8 pool (100 states on the fruit platform, fruit
# taken) kept a goal score of 0.00 and took 73-78% of starts for 1.2M steps; the
# from-reset chain then collapsed at the SN3 -> A1 jump (l3_v16 at 4.75M: 0/300 from
# the level start; l3_v15 246/300). A 100k smoke of this config on the fixed code put
# rung 8's score at 0.93 and its share at 0.22 by 100k (l3_v16: 0.00 and 0.72).
#
# WHAT IT ANSWERS. Whether the credit bug caused the collapse (inferred so far, from
# timing). If this run holds l3_v15's level from its own start, it is also the control
# l3_v17 (the start pool, whose gate kept rung 8 shut, so the bug did not touch it)
# never had.
#
# NOT one lever against l3_v15, as l3_v16's header claimed: the code between them also
# changed the reward (69fdac0 milestone marking mid-air, 850f7ae poses 6/7 in the
# reward's surface set) and the reach test (box -> sprite).
#
# READ IT ON, best snapshots re-measured at 300 episodes: from the level start (l3_v15
# 246/300, l3_v16 0/300) and on L3's held-out starts (l3_v15 0/300, l3_v17 0/300 at
# mean rung 1.5-1.7 / 12).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v18_l4rules_creditfix_warm_v15_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  waypoint_reach_mode: sprite
