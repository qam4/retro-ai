# ============================================================================
# L4 v31 -- CONTROL for l4_v32. WARM from l4_v30's FINAL weights (15M) and final pools,
# 6M, seed 42, L4 from its level start only.
#
# l4_v30's config continued: reward, PPO, curriculum and env byte-identical (it already
# trained on L4's settings, so nothing moves). Only `timesteps`, `output` and the warm
# start differ.
#
# FINAL, NOT THE CHAMPION. level4_notes.md "DO NOT WARM-START FROM A CHAMPION": a
# champion is the best of ~60 snapshots, so continuing from it regresses to the run's
# distribution by construction (control A0: 9.55 -> 1.20 within 250k). l4_v30's
# registered champion is its 13.25M snapshot; this run starts from 15M.
#
# No code since l4_v30 (f7d2d43) touched the reward; l4_v30's pool file holds no rung
# slots, so the start-credit fix (ce6bfbb) does not apply to it.
#
# READ IT ON, best snapshots re-measured at 300 episodes: on L4's held-out starts
# (l4_v30 champion 58/300, all from entries; one held-out group of 13 starts) and from
# the level start (l4_v30 220/300).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v31_ctrl_warm_v30_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v30_blockmax_cold_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l4_v30_blockmax_cold_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    carry_pose_bonus: 1.0
    carry_pose_ids: [15]

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
