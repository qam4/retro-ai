# ============================================================================
# L3 v19 -- l3_v15's REWARD AND REACH SEMANTICS on current code. WARM from l3_v15, 6M,
# seed 42, L3 from its level start only.
#
# l3_v18's config with three settings put back to what l3_v15 trained under (commit
# 10e9bb4), all through config:
#   curriculum.waypoint_reach_mode  box        (l3_v18: sprite; the trainer forces the
#                                               same value into the reward)
#   reward.params.mark_airborne     false      (default true since 69fdac0; at 10e9bb4
#                                               milestones were marked on surface frames
#                                               only)
#   reward.params.surface_pose_ids  [0,1,2,3,4,5,8]
#                                              (the reward's grounded set before
#                                               850f7ae added the left-walk poses 6 / 7)
#
# WHY. l3_v15 dropped to no princess from its level start several times in 15M steps
# and always recovered, within 0.76M steps at most (training log, princess EMA < 0.05).
# Both warm continuations on current code stayed down: l3_v16 from 1.31M to the end
# (4.69M), l3_v18 -- with the start-credit fix -- from 2.21M to the end (3.80M), with the
# route breaking at a different point each time (escalator exit, SN3 -> A1, Lsc2,
# escalator boarding). The credit fix did what it should (rung 8: score 0.97-0.98,
# 3-13% of starts) and the collapse still came.
#
# WHAT IT ANSWERS. Recovers like l3_v15 (no spell over ~0.8M) -> the cause is among
# these three; test them one at a time next. Collapses like l3_v16 / l3_v18 -> the
# cause is a change config cannot undo.
#
# NOT RESTORED, known: yeti.SURFACE_POSES, the trainer's own grounded set for seed
# capture and box-mode detection, also lacked poses 6 / 7 at 10e9bb4 (added in f2d37cb,
# 2026-08-28), and 27 trainer commits since (deferred waypoint capture, the group
# ladder, start groups, root pools, the credit fix) are code. So this is "as close to
# l3_v15 as config gets", not l3_v15.
#
# READ IT ON: the princess EMA from the level start over training (spells below 0.05,
# against l3_v15's 0.76M worst), and 300-episode re-measures from the level start
# (l3_v15 246/300).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v19_v15semantics_warm_v15_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true
    mark_airborne: false
    surface_pose_ids: [0, 1, 2, 3, 4, 5, 8]

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  waypoint_reach_mode: box
