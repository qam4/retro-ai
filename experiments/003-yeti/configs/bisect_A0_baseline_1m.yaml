# BISECT A0 — the CONTROL. v6's code and config, only the warm-start source changed.
#
# QUESTION: does training from v6's CHAMPION collapse even with none of the later changes?
#
# v10 took a 9.55 policy to 4.13 mean rung within 1M steps. It carried four differences
# from v6, not three, and the fourth was never flagged: it warm-started from v6's
# best/best_model.zip, whereas v6 itself started from v4's final_model.zip. A champion is
# SELECTED as the best of ~150 snapshots, i.e. selected for being an outlier, so continuing
# training from one regresses toward the mean almost by construction. That alone could
# explain the whole collapse.
#
# This arm isolates it: code at bc85424 (old anchors, jump tolerance 6, SURFACE_POSES
# without poses 6/7), v6's config, v6's pools, seed 42 -- only `resume` differs.
#
# Pools are staged in /tmp/a0_start/ alongside the weights because `training.resume_pools`
# does not exist at this commit; pools load from dirname(resume). v6's pools were captured
# under v6's anchors, which is what this arm uses, so all 20 are valid here.
#
# MEASUREMENT IS FIXED ACROSS ARMS: judge every arm by evaluating its snapshots with the
# CURRENT code (tol 2), never by its own route table. Training-time detection differs
# between arms by design; the measuring stick must not. Sanity: the current evaluator
# scores the shared starting policy at 9.55, and scored it 9.38 under the old tolerance,
# so it is a valid stick for both.
#
# READ:  mean rung at 1M.  ~8.5 = no collapse (matches v10 at 500k).  ~4 = collapsed.
#        If THIS collapses, none of the geometry or pose changes are implicated and the
#        warm-start-from-champion choice is the cause.

training:
  timesteps: 1_000_000
  output: output/mo5/yeti/training/bisect_A0_baseline_1m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  # v4's weights AND v4's pools (checkpoints.pkl is loaded from dirname(resume)).
  resume: /tmp/a0_start/best_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
