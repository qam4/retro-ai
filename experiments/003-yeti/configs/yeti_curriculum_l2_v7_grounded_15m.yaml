# yeti_curriculum L2 v7 — more compute at the validated v6 recipe (15M).
#
# v6 (3M) validated the reward fix (airborne-HOLD + death-gate): farm gone,
# reward flat/low, agent descends to F3 reliably and stably (no collapse), unlike
# v4/v5. But 3M is small (L1 champions ran 12-20M) and the agent plateaus at the
# floor-3 goat (x~34): it descends to F3 and jumps into the goat every time
# (grounded death, not a fall; see experiments/003 H-AH/diagnosis).
#
# Hypothesis: the F3 goat is a TIMING skill (like L1 snowballs, which PPO
# learned) — the agent just gets very few F3 reps per episode from the cold
# start. More steps => more F3-goat exposure => maybe learns to dodge. This is
# the cheap "more compute" test before building the optional-waypoint curriculum
# (H-AI), which would concentrate F3 practice and get there faster if 15M still
# plateaus. Config is byte-identical to v6 except timesteps.

training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l2_v7_grounded_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000

env:
  profile: yeti_fruit_level2
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 2
    gamma: 1.0

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 16
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 2
  fruit_presence_addrs:
    1: 11950
    2: 11975
  start_state: output/mo5/yeti/level2/level2_start.sav
