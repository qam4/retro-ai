# ============================================================================
# L4 v32 -- START POOL. WARM from l4_v30's final weights and pools, 6M, seed 42.
# ONE lever vs l4_v31: curriculum.root_pool, L4's registered start pool (l4_p1, TRAIN
# split: 4 route groups, 72 states -- entries of L4 after l3_v15 finished L3 at
# different moments, and respawns -- plus the level start as one more group; 1 group,
# 13 states, held out).
#
# WHY. l4_v30 reaches the princess 220/300 from its level start and 58/300 on the
# held-out starts, all 58 from entries (58/272; respawns 0/28). It is the only champion
# that already trained on L4's settings, so a warm start here is a clean one-lever test,
# unlike the L2 / L3 pairs. On L2 the same lever (l2_v12) memorised 3 of 56 starts and
# lost the saved start; on L1 (l1_v24) it gave 16/300 held out and lost the reset.
#
# WEAK BAR, stated: L4's held-out split is one group of 13 starts, because route_choices
# finds only 5 groups on L4 (its starts differ mostly in timing).
#
# READ IT ON: as l4_v31. The referee scores L4 on its held-out starts only, against
# l4_v30's 58/300.
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v32_startpool_warm_v30_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v30_blockmax_cold_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l4_v30_blockmax_cold_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    carry_pose_bonus: 1.0
    carry_pose_ids: [15]

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
  root_pool: experiments/003-yeti/data/start_pools/l4_p1.json
