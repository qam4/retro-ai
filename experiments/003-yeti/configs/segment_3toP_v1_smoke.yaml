# Smoke test for segment_3toP_v1: 50k steps, no warm-start so we
# can see the seed-pool wiring works in isolation. This lets us
# verify the pipeline launches, stalls don't kill us in 15 frames,
# and the universal reward fires correctly when fruits drop from 1
# to 0.

training:
  timesteps: 50_000
  output: output/mo5/yeti/training/segment_3toP_v1_smoke
  num_envs: 8
  seed: 42

env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_universal
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

segment:
  checkpoints: output/mo5/yeti/seeds/v9_v3_cp3enriched.pkl
  segment: 3
