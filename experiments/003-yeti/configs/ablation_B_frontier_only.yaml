# Ablation B: Frontier-only (checkpoint 1 seeded)
# Always start from the highest available checkpoint. Never revisit
# game reset or earlier checkpoints. Seeded from Go-Explore archive.
# Tests whether pure frontier training is enough, or if the agent
# forgets how to reach the frontier from earlier positions.

training:
  timesteps: 5_000_000
  output: output/mo5/yeti/training/ablation_B_frontier_only
  num_envs: 8
  seed: 42

env:
  profile: mo5_yeti_training
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]

reward:
  name: fruit_bonus
  params:
    scale: 0.01

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 1.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  seed_archive: output/mo5/yeti/go_explore_v8/archive.pkl
