# Ablation E: Reset-heavy with seeded checkpoints
# 80% game reset, 15% frontier, 5% earlier. Seeded from Go-Explore.
# Tests whether a strong reset bias (agent mostly practices full runs)
# combined with occasional frontier starts is better than the balanced
# mix. Lower stall threshold forces quicker episode turnover.
#
# NOTE: The original plan called this "reset-with-mid-episode-reload"
# (teleport to checkpoint on stall instead of terminating). That would
# require a code change to CheckpointCurriculumEnv. This config
# approximates the intent with a high reset fraction + low stall
# threshold. The mid-episode-reload variant can be added later.

training:
  timesteps: 5_000_000
  output: output/mo5/yeti/training/ablation_E_reset_heavy
  num_envs: 8
  seed: 42

env:
  profile: mo5_yeti_training
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 10
  resize: [84, 84]

reward:
  name: fruit_bonus
  params:
    scale: 0.01

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.8
  frontier_fraction: 0.15
  earlier_fraction: 0.05
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  seed_archive: output/mo5/yeti/go_explore_v8/archive.pkl
