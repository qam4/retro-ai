# ============================================================================
# L2 v11 -- CONTROL for l2_v12. WARM from l2_v10 (the L2 champion), 6M, seed 42, L2
# from its level start only.
#
# l2_v10's config continued on the L4 settings the weights can carry:
#   reach test   curriculum.waypoint_reach_mode sprite (l2_v10 trained with box, the
#                only test before c666500), as on L1 and L4.
#   stop rules   max_steps 1500 / stall_threshold 40 (was 1000 / 40), as on every other
#                level; the registry moved L2 with this run.
# The resize mode stays l2_v10's "nearest": shown L4's "max", l2_v10 died in 20/20
# episodes from its own start (298/300 under nearest), so a warm start cannot take it.
# Death flag and native stall (bonus_stall_frames 120) were already L4's: the L2 and
# L4 game profiles differ only in their names.
#
# Everything else -- reward, PPO, curriculum -- is l2_v10's; weights-only warm start
# from the registered model (best/best_model.zip) and l2_v10's final pools. It measures
# what 6M more steps do on their own, so l2_v12's start pool is the only difference
# between the two.
#
# READ IT ON, best snapshots re-measured at 300 episodes: on L2's held-out starts
# (l2_v10: 0/300, no fruit in any episode) and from the level start (l2_v10: 298/300
# under 1000 / 40; re-measured under 1500 / 40 with this run).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l2_v11_l4rules_warm_v10_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l2_v10_deferfruit_10m/best/best_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l2_v10_deferfruit_10m/checkpoints.pkl

env:
  profile: yeti_fruit_level2
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 2
    gamma: 1.0
    defer_fruit_credit: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.05

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 2
  fruit_presence_addrs:
    1: 11950
    2: 11975
  start_state: output/mo5/yeti/level2/level2_start.sav
  waypoints: true
  waypoint_tolerance: 2
  waypoint_reach_mode: sprite
