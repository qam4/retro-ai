# v19 PHASE 1 — 15M, COLD, seed 42. ONE lever vs v16c's 15M: n_steps 512 -> 16.
#
# WHY. Every L4 cold run so far (v14, v15, v16a/b/c, v17) used `n_steps: 512` with NO
# `target_kl`, cold. That is the configuration experiments/003-yeti-training.md already
# documents as unable to learn from scratch:
#
#   "the steady recipe cannot learn from scratch; the big-step phase-1 was doing
#    essential exploration"
#   "Practical rule: never start cold-steady -- use phase-1 exploration (or warm-start
#    past the early walls) to find the basin, then anneal."
#
# and `yeti_curriculum_v16_coldsteady.yaml` is the run that proved it: n_steps 512 +
# target_kl 0.05, cold, 20M, and EVERY snapshot scored princess 0.0 and reach4 0.0.
#
# The interpretation there is simulated annealing on the policy:
#   phase 1  n_steps 16, no target_kl  = HIGH temperature. Small rollouts -> large, noisy,
#            sometimes destructive updates (measured KL up to 68) that can stumble across
#            a behavioural plateau. Crossing one needs a whole new skill chunk, so small
#            greedy steps cannot: nothing nearby improves the return.
#   phase 2  n_steps 512, target_kl 0.05 = LOW temperature. KL-bounded steps that settle
#            into the basin without destroying it.
#
# L4 IS EXACTLY THAT SITUATION. The level stops at one transition: the agent reaches
# floor 11 and is crushed before it can start the floor-12 jump. The jump itself is 60%
# executable by scripted input; what decides the outcome is how many frames of life the
# agent has ON ARRIVAL (hold NOOP from the arrival state and count). Measured:
#
#   the floor-12 approach needs                     8 frames
#   v16c cold, plateaus from 5.5M to 15M            3-5      never improves
#   v18 (warm from v13), at its FIRST snapshot      10       inherited, not learned
#   v6 / v13                                        12
#
# So a cold run reaches a ceiling of 3-5 by 5.5M and sits there for ten million further
# steps. That is a behavioural plateau, which is precisely what the high-temperature
# phase exists to escape -- and what `n_steps: 512` cold cannot.
#
# READ IT ON ARRIVAL SURVIVABILITY, NOT REACH. The question is whether exploration finds
# the floor-11 timing at all, so the measurement is:
#   diag/l4_seed_determinism.py --run <this> --pools Lclimb3_top --over-snapshots 8 \
#     --noop-cap 40 --vs-reset 25 --models <this>/final_model.zip
# A rising trend means phase 1 is finding it and phase 2 should anneal it. Flat at 3-5
# means the temperature change did not help either, and the plateau is something else.
#
# DO NOT JUDGE THIS ON A SINGLE-RUN REACH COMPARISON. Measured run-to-run variance at
# FIXED seed 42, two runs identical but for `timesteps`: Lclimb3_top mean over 4M-6M was
# 0.19 in one and 0.35 in the other. Any reach difference smaller than that band is noise.
# level3_notes.md puts it bluntly: "a single 600k control on L3 proves nothing. 1 in 3
# seeds collapses" -- and "this invalidates every n=1 verdict taken this session".
#
# WHAT IS DELIBERATELY UNCHANGED: everything else, including `ent_coef: 0.02` (the L2/L3
# phase-1 configs used 0.01, but matching v16c keeps this to ONE lever) and the absence of
# `target_kl` (already absent in v16c, and phase 1 wants it absent anyway).
#
# THROUGHPUT WARNING: n_steps 16 x num_envs 8 = a 128-step rollout against v16c's 4096, so
# ~32x more optimiser updates per environment step. Wall clock per timestep will be worse
# than v16c's 7h/15M. Measure it on the smoke before trusting the budget below.
training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v19_phase1_cold_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  route_table_freq_steps: 50_000

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  # THE LEVER: phase-1 exploration. Small rollouts -> big, noisy, sometimes destructive
  # updates, which is how the recipe escapes a behavioural plateau.
  n_steps: 16
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  # NO target_kl, deliberately: bounding the KL is what phase 2 does.

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
