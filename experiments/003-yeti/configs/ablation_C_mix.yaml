# Ablation C: Balanced mix (the main hypothesis)
# 40% game reset, 40% frontier checkpoint, 20% earlier checkpoints.
# Seeded from Go-Explore archive. This is the configuration we expect
# to work best — it maintains the ability to play from reset while
# pushing the frontier forward.

training:
  timesteps: 5_000_000
  output: output/mo5/yeti/training/ablation_C_mix
  num_envs: 8
  seed: 42

env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]

reward:
  name: fruit_bonus
  params:
    scale: 0.01

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.4
  frontier_fraction: 0.4
  earlier_fraction: 0.2
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  seed_archive: output/mo5/yeti/go_explore_fruit/archive.pkl
