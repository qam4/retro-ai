# ============================================================================
# L3 v22 -- WHICH SETTING COLLAPSES L3, 2 of 3: milestone marking. WARM from l3_v15, 6M.
# ONE lever vs l3_v18: reward.params.mark_airborne false (default true since 69fdac0):
# reward milestones are marked on the reward's surface frames only, as at 10e9bb4. The
# other two settings stay at l3_v18's (sprite reach; poses 6 / 7 in the reward's
# grounded set).
#
# WHY and READ IT ON: as l3_v21 (yeti_curriculum_l3_v21_boxreach_warm_v15_6m.yaml).
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v22_groundmark_warm_v15_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true
    mark_airborne: false

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  waypoint_reach_mode: sprite
