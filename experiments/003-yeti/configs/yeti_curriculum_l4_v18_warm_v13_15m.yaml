# v18 warm from v13 — 15M, seed 42. ONE lever vs v16c's 15M: the warm start.
#
# THE QUESTION. v6 and v13 got past floor 11 and walled at rope 2; v16c walls at floor 11.
# The map and the reward were IDENTICAL in all three — `Low1_launch` was already skipped
# by bc85424 (2026-08-27) before v6 (08-28) and v13 (09-10), so no launch pad, no floor-12
# milestone and free death in every case. The measured difference is arrival survivability
# on floor 11, from reset:
#
#   v6    median 12 NOOP frames of life        the approach needs 8 steps
#   v13   median 12                            -> executable
#   v16c  median  3                            -> doomed on landing
#
# Three candidates could explain it and none is isolated: warm vs cold, box vs sprite
# reach geometry, and `target_kl: 0.07` (set by v6/v13, absent from every v16 config).
# This run tests the first.
#
# WHAT IT DECIDES. If v13's arrival timing survives into a run under v16c's reward and
# sprite geometry, the timing was INHERITED and cold runs simply never find it — which
# makes warm-starting the practical route to the princess and makes "cold" the thing that
# costs us floor 11. If it degrades toward 3 frames, something in the v16 configuration
# destroys it, and box-vs-sprite or target_kl becomes the next suspect.
#
# WHY v13's final_model AND NOT ITS CHAMPION. level4_notes.md records "DO NOT WARM-START
# FROM A CHAMPION" — a champion is selected as the best of ~150 snapshots, i.e. an
# outlier, and v10 cost 6.5h learning that. `final_model.zip` is the unselected end state,
# which is exactly what v13 itself resumed from v4. Pools come with it
# (checkpoints.pkl is read from dirname(resume)), so v13's `Low1` pool of 100 comes too —
# that is deliberate: the question is whether the BEHAVIOUR transfers, and denying it the
# pools would confound the test with a curriculum change.
#
# NOT A CLEAN ONE-LEVER RUN, stated plainly: v13 was trained under BOX reach geometry and
# with target_kl, so its weights carry that history into a sprite/no-target_kl run. The
# result is therefore evidence about transfer, not a controlled comparison. It is worth
# running anyway because it is the only cheap way to ask whether the timing skill exists
# in a form that can be handed over.
#
# READ IT ON: arrival survivability from reset (the 12-vs-3 number), `Low1` pool size, and
# whether rope 2 (`Low2`) moves at all — v13's champion managed 1/300 at rung 12.
training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v18_warm_v13_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  route_table_freq_steps: 50_000
  # v13's weights AND v13's pools (checkpoints.pkl is loaded from dirname(resume)).
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v13_anchors_15m/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
