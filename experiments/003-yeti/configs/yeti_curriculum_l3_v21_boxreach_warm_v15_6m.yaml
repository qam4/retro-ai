# ============================================================================
# L3 v21 -- WHICH SETTING COLLAPSES L3, 1 of 3: the reach test. WARM from l3_v15, 6M.
# ONE lever vs l3_v18: curriculum.waypoint_reach_mode box (l3_v18: sprite). The
# trainer forces the same value into the reward, so detection, capture and milestone
# marking all move together. The other two settings stay at l3_v18's (milestones
# marked mid-air; poses 6 / 7 in the reward's grounded set).
#
# WHY. With all three new settings, l3_v16 and l3_v18 lost the princess from the level
# start for good (4.69M and 3.80M below 0.05). With all three put back, l3_v19 held it
# (191/300 at 6M; longest spell 1.44M, then recovered), as l3_v15 did (worst 0.76M).
# l3_v21 / l3_v22 / l3_v23 each put back ONE of the three onto l3_v18.
#
# READ IT ON: the princess EMA from the level start (spells below 0.05, against
# l3_v19's 1.44M and l3_v18's 3.80M to the end), and a 300-episode re-measure of the
# final snapshot from the level start. ONE run per arm: the collapse is a stochastic
# event (l3_v15 itself dropped to 0 and recovered several times), so a run that holds
# is evidence, not proof.
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v21_boxreach_warm_v15_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  waypoint_reach_mode: box
