# yeti_curriculum L3 v10 — COMPOSE phase (cool the re-heat, stitch reset->princess).
#
# v9 (launch-WPs + re-heat) ACQUIRED the whole upper level: from seeds it grabs
# the fruit reliably (cp pool full) and touches the princess from Lprincess_top
# (goal_score ~0.96) — the A1..A5 ascent is solved in pieces. BUT the re-heat
# (target_kl 0.10, ent 0.03) destabilized the previously-solid lower chain, so
# from a COLD RESET the escalator->snowball chain collapsed (Lsc3 0.82->0.04).
# Note: reset (CP0) was already ~60% of v9 episodes (pick_start weights CP0 by
# 1-goal_score, and the fruit-CP is reach-gated out), so the collapse is NOT
# under-practice — it's the HOT updates. So v10 just COOLS back down; the full
# from-reset chain is now seeded end-to-end and should compose.
#
# CHANGE vs v9 (one lever): COOL the temperature back to the anneal.
#   ent_coef 0.03 -> 0.01
#   target_kl 0.10 -> 0.05
# Everything else identical (launch-WPs live, same pools, reset share emergent).
#
# Warm-start is DECOUPLED (champion dir output/mo5/yeti/champions/l3_v10_base/):
#   WEIGHTS = v8-final  (from-reset lower chain intact: Lgoat 0.98 / Ldown 0.95 /
#     Lsc1 0.95 / Lsc2 0.93 / Lsc3 0.93 / SN3 0.67)
#   POOLS   = v9-final checkpoints.pkl (the ascent bootstrap: all 19 WP pools,
#     fruit pool full, Lprincess_top goal_score 0.97)
# v9's WEIGHTS were REJECTED: a from-reset snapshot sweep of ALL 30 v9 snapshots
# showed the re-heat degraded the lower chain across the WHOLE run (every
# snapshot <=30% BOTTOM, ~0% SN3; debug/l3_v9_sweep_mon/output.log). The upper
# SKILL is carried by the SEEDS, so the policy re-learns it quickly from them
# while the weights supply the lower chain. See the champion dir README.
#
# WATCH: reset_reach[1] (fruit-from-reset) rising off 0, from-reset wp_reach for
# the whole chain (Lsc4 then A1..A5, Lprincess_top) climbing, success 0->1
# flipping, and a princess-from-reset touch. keep-best sweep at the end (never
# trust the final snapshot — cooling still leaves some oscillation).

training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v10_compose_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  resume: output/mo5/yeti/champions/l3_v10_base/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01      # cooled back (v9 re-heat was 0.03)
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.05     # cooled back (v9 re-heat was 0.10)

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
