# Smoke test for the waypoint curriculum (H-AI, step 2). Tiny run to verify
# the env captures grounded waypoint states, the manager samples WP starts in
# the unified goal-score draw, and nothing crashes. Not a real training run.
# Same as v6 smoke + curriculum.waypoints: true.

training:
  timesteps: 4000
  output: output/mo5/yeti/training/yeti_curriculum_l2_v7_wp_smoke
  num_envs: 2
  seed: 42
  snapshot_freq_steps: 100_000

env:
  profile: yeti_fruit_level2
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 2
    gamma: 1.0

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 16
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 2
  fruit_presence_addrs:
    1: 11950
    2: 11975
  start_state: output/mo5/yeti/level2/level2_start.sav
  waypoints: true
  waypoint_tolerance: 2
