# ============================================================================
# L2 v13 -- l2_v12 CONTINUED, 14M more steps (20M in all). ONE lever: budget.
#
# l2_v12's config byte for byte except `timesteps`, `output` and the warm start, which
# is l2_v12's own final weights and final pools. (Weights only: PPO's optimiser state is
# not carried over.)
#
# WHY. In 6M, l2_v12 solved 3 of its 56 training starts (single-state respawn groups,
# 61-79% princess in its last 2M steps) and none of the entries; on the held-out starts
# its best snapshot read 13/300, all from respawns, 12 of them from one group. Each
# start got ~450 episodes; l1_v22 needed 10M steps on ONE start. The question is
# whether more budget generalises or only memorises more starts.
#
# KNOWN SKEW: entries were 14% of level-start episodes in l2_v12's last 2M (892 of
# 6318), because route_choices files 23 different entries as one group. Not changed
# here (one lever); read the result split by entries and respawns.
#
# READ IT ON, best snapshots re-measured at 300 episodes on L2's held-out starts, split
# entries / respawns: against l2_v12 (13/300 at 5M, entries 0/48) and l2_v10 (0/300).
# Also from the saved level start (l2_v12: 0/300; l2_v10: 294/300).
# ============================================================================
training:
  timesteps: 14_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l2_v13_startpool_cont_v12_14m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l2_v12_startpool_warm_v10_6m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l2_v12_startpool_warm_v10_6m/checkpoints.pkl

env:
  profile: yeti_fruit_level2
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 2
    gamma: 1.0
    defer_fruit_credit: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.05

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 2
  fruit_presence_addrs:
    1: 11950
    2: 11975
  start_state: output/mo5/yeti/level2/level2_start.sav
  waypoints: true
  waypoint_tolerance: 2
  waypoint_reach_mode: sprite
  root_pool: experiments/003-yeti/data/start_pools/l2_p1.json
