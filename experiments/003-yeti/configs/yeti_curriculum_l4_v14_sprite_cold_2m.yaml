# L4 v14 — 2M, COLD, sprite-overlap detection AND capture. A DIAGNOSTIC run, not a
# champion attempt.
#
# WHY COLD. Every L4 run since v4 has warm-started from v4's weights AND inherited v4's
# pools, so every pool this project has ever inspected was seeded by the tol-6/tol-2 BOX
# and then carried forward. There is no observation anywhere of where sprite-overlap
# capture actually puts seeds. Inheriting pools would answer the wrong question: the old
# seeds would still be there, and new captures would be judged against a pool the box
# built. So: no `resume`, no `resume_pools`. Random init, empty pools.
#
# WHAT IT IS FOR. Three questions, all answered by plotting anchors against the HEAD
# POSITION (sprite centre px, sprite TOP y -- the point the box test used) of every seed
# the run records:
#
#   1. Can the agent consistently reach the waypoints that are on the path to the
#      princess? Under the box, four launch pads were firing on their PREDECESSOR's seed
#      16-24 px away before the agent had moved -- `Fr1_launch` captured 100/100 seeds at
#      px 208, which is exactly `Lfruit_top`'s anchor, on the ladder at y 162 rather than
#      on floor 2 at y 158. Sprite overlap cannot do that: it needs the anchor inside the
#      agent's own 14x18 body.
#   2. Are some waypoints useless? A waypoint whose pool stays empty, or whose seeds sit
#      nowhere near its anchor, is not describing a place the agent goes.
#   3. Can the same treatment extend to the reward system? Reward marking uses tol 2 for
#      everything and is a separate code path; deciding that needs the capture data first.
#
# WHAT IT WILL NOT SHOW. Cold at 2M will not reach the deep route. v13 needed a warm start
# to hold `Low1`/`Low2_launch` at reach 0.5, and rope 2 is a ~0.3% event even for a
# champion. Expect the fruit floors, the ascent ladders and `Rope1` to populate, and
# expect the Hi chain and anything past `Low2` to stay empty. That is a limitation of the
# run, NOT evidence that those waypoints are useless -- do not read it as such.
#
# NOT A CHAMPION, NOT AN A/B. One seed, no control arm, cold. It cannot be compared with
# v6's or v13's snapshot distributions, which were all warm-started from v4. If sprite
# capture looks sane here, the comparison run is a separate, warm-started A/B.
#
# The code under test is de21939: `waypoint_reach_mode` defaults to "sprite" and now
# drives CAPTURE as well as detection. Under the box, 12 pairs of L4 capture boxes
# overlapped where the agent can stand (up to 33 px, the whole Hi chain, plus
# `Lhi_down_bot`+`Low2` and `Lclimb1_top`+`Rope1_launch`); under sprite overlap that
# count is zero, pinned by test_level4_sprite_regions_do_not_overlap_where_the_agent_can_stand.
training:
  timesteps: 2_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v14_sprite_cold_2m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  route_table_freq_steps: 50_000
  # NO resume and NO resume_pools, deliberately. See the header.

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

# Identical to v13's curriculum block except for waypoint_reach_mode, so the only
# intentional difference between this run and the v13 lineage is the reach geometry (plus
# the cold start, which is forced by the question -- see the header).
curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  # The lever. Default is now "sprite"; stated explicitly so this config records what it
  # ran under rather than depending on the default of the day.
  waypoint_reach_mode: sprite
  # `admit_requires_grounded` stays OFF: measured at 3 seeds x 2M with no effect on pool
  # composition and its behaviour is not understood (H-AW).
