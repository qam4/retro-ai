# yeti_curriculum L3 v3 — REBUILT nav map (correct geometry).
#
# Same from-scratch phase-1 recipe as v1/v2 (n_steps=16, no target_kl, WP
# curriculum, defer_fruit) so this is a clean A/B against them: the ONLY change
# is the corrected LEVEL3 nav map (commit ba71c00).
#
# Why v2 regressed and this should fix it:
#  - v2's reward used a MISCALIBRATED L3 map (floor_top_y off by ~18px; lossy
#    extractor). While climbing the goat ladder the agent's y bucketed onto a
#    snowball-side floor across the escalator, so the WP-target reward pulled
#    it toward the WRONG escalator component (~ -4.8 on the climb). It never
#    reached the goat platform -> 0 waypoint captures (v1 captured mid-ladder
#    seeds by luck and bootstrapped; v2 didn't).
#  - v3 uses the tilemap-verified map: standing_y = tile_row*8 - 18, each
#    platform its own floor-id with pixel x-extents, x-aware floor resolution.
#    The goat climb now freezes shaping mid-ladder (never mis-pulls) and pays a
#    coherent bonus on arriving at the TRUE goat platform (y94). Distances:
#    L1/L2 byte-identical; L3 goat climb finite; escalator + final ascending
#    climb are sparse INF (learned).
#
# EXPECTATION: reach the goat platform (real, y94) reliably and capture the
# Lgoat waypoints EARLY (v1 first-capture was step 63k; watch the wp_near line
# — Lgoat_a_top/Lgoat_b_top distance should shrink and captures should rise).
# NOT expected to solve the escalator (that gap is unshaped by design).
#
# NOTE: post-escalator platforms (BR/SN*/A*/PRIN) are in the map but only the
# pre-escalator segment is reachable from reset; the rest activates once the
# escalator is crossed (the next problem — segment training / demo / etc.).

training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v3_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 16
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
