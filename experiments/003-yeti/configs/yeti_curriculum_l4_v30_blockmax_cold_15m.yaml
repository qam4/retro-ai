# ============================================================================
# v30 — COLD, 15M, seed 42. ONE lever: env.resize_mode "max".
#
# Otherwise v29's yaml with the warm start REMOVED (`resume`, `resume_pools` and
# `warmstart_weights_only` deleted), `timesteps` 6M -> 15M, `output` changed and
# `snapshot_freq_steps` 100k -> 250k (60 snapshots, same referee cost as a 6M run).
# Reward, curriculum, PPO and every other env field are byte-identical to v29.
#
# WHY. The agent cannot see rope 2. It is a one-pixel red line, and the policy's
# 84x84 input comes from a nearest-neighbour resize that keeps one source pixel per
# output pixel, so the rope keeps 0-4 pixels and in some frames NONE (measured on
# 20 frames across the L4 route). Rope position alone does not say "jump now" --
# wait 0 misses and wait 16 crosses with a near-vertical rope in both -- so the cue
# is the direction of swing, read from how those few pixels move across the 4
# stacked frames. A block-max resize keeps 12-15 rope pixels in every frame.
# Figures: screenshots/rope2_resize_closeup.png, rope2_resize_fullscreen.png.
#
# WHY COLD. Measured: the v29 champion evaluated from reset, 60 episodes each way,
# reads mean rung 8.17 under "nearest" and 0.02 under "max" (Lfruit_top 1.00 ->
# 0.00). Block-max changes ~14% of every frame -- every bright edge grows by up to a
# pixel, ladders lose their rungs -- so no existing L4 policy survives it. The
# precedent for a cold L4 run reaching the warm incumbents is v16c: 15M from
# scratch matched v13's 15M warm on mean rung (8.49), champion at 9.3M.
#
# THE REFEREE MUST SCORE WITH THE SAME RESIZE. run_train_and_score.sh reads
# env.resize_mode from this file and passes --resize-mode to keep_best_sweep, which
# forwards it to eval_from_reset. Scoring a "max" policy under "nearest" does not
# error; it just reads as a collapse.
#
# READ IT ON, in order:
#   1. does it reach the rope-2 pad at all? Low1 must be the frontier in a good
#      share of evals by the end, or the run says nothing about rope 2.
#   2. does Low2 reach -- from reset, in the referee -- leave 0.000? It has been
#      0.000 in every eval of every L4 run from v23 to v29, so the null is "never
#      happens" and ONE run is informative.
#   3. pool bootstrap: genuine Low2 crossings per run (control 3-7 in 6M) and
#      whether Low2 / Lprincess_top fill.
# NOT on mean_rung against the warm runs: a cold run is a different starting
# point, and three identical warm runs already span 1.011 rungs.
#
# Control: there is no cold "nearest" run on current code. The readouts above are
# chosen so the warm control distribution (v24, v28a/b/c, v29) is enough: Low2
# reach is pinned at 0 in all of them regardless of start.
#
# The original v29 header follows unchanged.
# ============================================================================
# ============================================================================
# v29 — ONE LEVER: the `Low2_launch` waypoint is gone (68c91ff).
#
# This yaml is byte-identical to v24's except `training.output`. The lever is in
# CODE -- `LEVEL4.jump_waypoint_skip` gained "Low2_launch" and `route_order` lost
# it -- so the control arm is the PARENT COMMIT, which is exactly what v28a/b/c
# measured at 723993e.
#
# WHAT IT DOES. The agent no longer gets start states on the rope-2 pad. It has to
# arrive there from `Low1`, on the same platform, whose pool is healthy (95 of 100
# seeds at px 220, on safe ground). The pad's own pool was 61% unplayable: 60 of
# 100 seeds on px 184, which dies at step 82 from rest, kept past the 30-step
# survival gate by the spring below the gap and ending the window in pose 17.
#
# WHY IT SHOULD BE POSSIBLE. Scripted from a px-220 `Low1` seed, 26 of 136 plans
# cross: run-up 11..13 left steps to px 188/192, then wait 16..24, then hold
# jump-left. Both rope catches are phase-locked to absolute time, so one held
# input reaches both and the launch window is 10 of every 31 steps.
#
# READ IT ON `Low2` REACH LEAVING 0.000, and nothing else. That is the asymmetry
# worth using: `Low2` and princess have been 0.000 in all seven runs to date,
# ~420 evals, so the null is "never happens" and ONE run is informative.
#
# DO NOT read it on `mean_rung`. Measured on the three replicates, three identical
# runs span 1.011 rungs (sd 0.530), so a single run cannot resolve a shift below
# ~1.5 rungs against a single control, and this run has no replicates. If
# `mean_rung` lands anywhere in 3.5..5.7 that is the control distribution and means
# nothing either way.
#
# EXPECTED SIDE EFFECT, not a regression: the reported `frontier` will change shape,
# because `Low2_launch` was the frontier in 45-48 of 56-60 evals and no longer
# exists. Expect `Low1` to become the frontier instead. The old "mean Low2_launch
# rate" headline is undefined for this run by construction; do not compare it.
#
# Champion `score` is also not comparable with earlier runs: depth is
# `(index + 1) / len(route_order)` and the denominator went 30 -> 29. It still
# picks the best snapshot correctly WITHIN this run.
#
# The original v24 header follows unchanged.
# ============================================================================
# v24 — 6M, seed 42. Warm POLICY from v23, and NO inherited seeds.
#
# WHAT IT TESTS: whether `Low2` -- the rope-2 landing, empty for the life of this level --
# fills from our own captures once capture works.
#
# THE BUG IT FOLLOWS. Waypoint capture required the agent to be grounded AND within reach
# of the anchor in the SAME frame, while the FRUIT path has always deferred the save to
# the next grounded frame. `Low2`'s anchor is px 128 and floor 13's extent is [0..128),
# so the anchor is off the platform and NO standable position reaches it: the nearest is
# px 120, 8 px away, and the sprite reaches 6 px right of centre. Measured on a real
# crossing, `Low2` registers for 5 frames MID-FLIGHT at px 124-132 and the agent then
# lands a few pixels past it, so nothing was ever saved. `Rope1` escapes by luck -- its
# anchor is 4 px inside floor 7, and exactly one standable spot (px 112) reaches it.
# v4 banked ONE `Low2` state ever; v13 grew it to 11 by re-capturing from that one.
#
# TWO CODE CHANGES ride in this run, both in train_checkpoint_curriculum.py:
#   * waypoint capture defers to the next grounded frame, like fruits
#   * a rung is a GROUP, so the `Low2`/`Lhi_down_bot` OR pair and the graph aliases stop
#     double-counting. L4 drops from 13 rungs to 12, so every reach index shifts and
#     reach numbers are NOT comparable with v21/v23 column by column.
#
# WHY NO SEEDS. 140 of 1790 inherited seeds (8%) sit where today's sprite test rejects
# them, concentrated exactly where it matters: all 70 of Hi5, all 3 of Hi1_launch, 10 of
# the 11 Low2, 12 of Lhi_down_bot. They were captured under v13's BOX geometry with the
# jump tolerance of 6. Rung renumbering makes the old `reached` sets misleading too.
#
# READ IT ON, in this order:
#   1. does `Low2_launch` refill? if not, the chain never got that far and the run says
#      nothing about rope 2
#   2. does `Low2` fill? if yes, capture was the blocker
#   3. if `Low2_launch` refills and `Low2` stays empty, crossings do not happen even from
#      a pad seed, and the release is the problem
#
# NOT A ONE-LEVER RUN, stated plainly: two code changes plus the empty pools. v23 is not
# a control for it. It is a diagnostic, and what it measures is a pool count, not a score.
#
# --- inherited from v23 (unchanged) --------------------------------------------------
# v23's lever was `carry_pose_bonus: 1.0` on pose 15, kept here.
#
# THE QUESTION. Rope 2 is an EXPECTED-VALUE problem, not an exploration one. Measured on
# the `Low2_launch` pad with l4_pad_reward.py, through the trainer's own reward:
#
#   hold still                                    0.000
#   walk LEFT off the edge                       +0.075   CERTAIN
#   jump and miss the rope                        0.000
#   completed crossing (NOOP:20,JUMP_LEFT:70)    +2.940   median 2.920, n=6
#
# A crossing already pays 39x the cliff-walk, but ATTEMPTING it is worth ~1% x 2.940 =
# +0.029 expected against a certain +0.075, and the whole +2.94 arrives on landing. The
# agent is taking the better bet. This puts +1.0 on the attempt itself:
#
#   walk off the edge      +0.075
#   grab and fail          +1.000   13x the cliff-walk -> the choice flips
#   complete the crossing  +3.940   4x a grab          -> finishing still dominates
#
# WHY NOT +10 (proposed first): 3.4x the entire value of the crossing and 1.5x a median
# episode, i.e. it would say touching the rope matters more than what touching it
# achieves. Full derivation in level4_notes.md "ROPE 2 IS AN EXPECTED-VALUE PROBLEM".
#
# CONTROL ARM: v21. Verified by diffing the parsed YAML -- only `carry_pose_bonus`,
# `carry_pose_ids` and `output` differ, so `ent_coef: 0.01` and the warm start from v13's
# final_model are held fixed.
#
# READ IT ON: `Low2` reach (0/300 for the life of this level), pose-15 frequency, and
# `Low2_launch` prog, which has been exactly 0.00 in every run so far.
#
# THE RISK, on the record: the term fires on an event the policy currently produces in
# roughly 0 of 400 episodes, so it may be too weak a signal to bootstrap. If nothing
# moves, the next lever is the MAGNITUDE, not the mechanism.
#
# --- inherited from v21 (unchanged) --------------------------------------------------
# v21's own lever was `ent_coef` 0.02 -> 0.01, kept here at 0.01.
#
# THE QUESTION v21 ASKED. Entropy measured on a fixed observation batch
# (scripts/mo5/yeti/diag/policy_health.py, joystick [3,3,2], max 2.8904 nats):
#
#   L1 yeti_curriculum_v15_phase2            princess 0.998    H  2.0 - 6.0% of max
#   L2 yeti_curriculum_l2_v10_deferfruit_10m princess 0.993    H  6.0 - 16.6%
#   L3 yeti_curriculum_l3_v15_gatewp_15m     princess 0.953    H 52.6 - 63.1%
#   L4 v18 (this run's parent config)        princess 0.000    H 52.5 - 64.5%
#   L4 v16c cold                             princess 0.000    H 71.8 - 89.8%
#   L4 v19 n_steps 16                        princess 0.000    H   24 - 32%
#
# The two levels finished RELIABLY run committed policies near zero entropy, and both
# used `ent_coef: 0.01`. All 49 L4 runs to date used 0.02 and none has gone below ~52%
# except v19, which committed inside 1M steps to a route worth nothing. L4's wall is a
# transition needing an 8-step approach executed inside a 10-frame window on floor 11 —
# precision a 60%-entropy policy cannot deliver even when it knows the route.
#
# NOT CLAIMED: that low entropy CAUSES finishing. A policy that found a reliable route
# sharpens on its own, so the correlation above is compatible with entropy being the
# signature of success rather than its cause. What argues against pure readout: v16c at
# its peak reach10 of 0.77 sits at 72% while v18 at the same reach10 sits at 64%, and v19
# reached 24% having found nothing. This run is the test.
#
# CONTROL ARM: v18's own snapshots from 0 to 6M. Nothing else in this file differs from
# yeti_curriculum_l4_v18_warm_v13_15m.yaml except `ent_coef`, `timesteps` and `output`,
# and truncating the budget is safe to compare against because nothing here is scheduled
# on training progress — `learning_rate` and `clip_range` are passed to PPO as plain
# floats (train_checkpoint_curriculum.py, the PPO(...) call), so 6M is v18's first 6M
# with one coefficient changed.
#
# WHY NOT ALSO `target_kl: 0.05`. The L1/L2 winners set both, and no L4 run has ever set
# target_kl to 0.05. It is a second lever and gets its own run (step 1b of the plan in
# experiments/003-yeti-training.md), because with both moved a null result would be
# unattributable — the mistake level4_notes.md's RUN PROTOCOL exists to prevent.
#
# WHY v13's final_model, NOT v18's. Two reasons. It keeps the warm-start SOURCE identical
# to v18's, which is what makes v18 a control rather than a loose comparison. And
# level4_notes.md records "DO NOT WARM-START FROM A CHAMPION" with a measured control arm
# behind it (A0: starting policy 9.55 -> 1.20 -> 2.43 -> 7.53 -> 1.03 within 1M), so
# v18's 900k champion is exactly the wrong thing to continue from.
#
# STOP RULE: entropy below 30% of max by 2M. Still above 50% at 2M means the coefficient
# alone is not enough — kill the run and build the entropy controller (plan step 3)
# rather than paying for the remaining 4M.
#
# READ IT ON, judged over the snapshot DISTRIBUTION and not the final model or the
# champion: entropy trajectory via policy_health.py; `Low1` at or above v18's 0.743; and
# whether anything appears past floor 12 (`Low2_launch` onward), which no L4 run has done.

training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v30_blockmax_cold_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  # v13's weights AND v13's pools (checkpoints.pkl is loaded from dirname(resume)) —
  # byte-identical to v18's warm start.
  # NO INHERITED SEEDS. Points at a deliberately empty pool file so the policy comes
  # across warm while every pool rebuilds from this run's own captures. Reasons: 140 of
  # 1790 inherited seeds (8%) sit at positions today's sprite test rejects -- including
  # ALL of Hi5 and Hi1_launch and 10 of the 11 Low2 states, captured under v13's box
  # geometry with the jump tolerance of 6 -- and rung numbering has changed, so a rung
  # recorded in an old seed no longer means the same thing.

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    # THE LEVER vs v21. Flat +1.0, once per episode, for the leftward rope carry
    # (pose 15) -- the manoeuvre rope 2 is made of. Derivation in level4_notes.md
    # "ROPE 2 IS AN EXPECTED-VALUE PROBLEM": walking off the edge banks +0.075 CERTAIN
    # while attempting the rope is ~1%% x 2.940 = +0.029 expected and 0.000 on a miss,
    # so the agent correctly takes the worse outcome. +1.0 flips that (13x the
    # cliff-walk) and still leaves a completed crossing worth 4x a grab (+3.94).
    carry_pose_bonus: 1.0
    carry_pose_ids: [15]

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  # THE LEVER. v18 used 0.02, as did every other L4 run. Both reliably-finished levels
  # used 0.01.
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
