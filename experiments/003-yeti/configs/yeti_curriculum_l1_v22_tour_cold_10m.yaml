# ============================================================================
# L1 v22 -- COLD, TOUR POTENTIAL, 10M, seed 42. ONE lever vs l1_v21:
# reward.params.route_potential: true.
#
# Today's potential is the SUM of path distances to every fruit left. Over a whole
# route that pays more for longer routes (the jump at each pickup is never charged):
# 14.40 for the shortest order F1 -> F2 -> F3 -> F4 (960 px) and 16.96 for the order
# l1_v17 takes, F1 -> F3 -> F4 -> F2 (1472 px), at scale 0.01. At the top of L12a after
# F1 the sum charges -0.40 for walking 40 px to F2 and pays +1.20 for walking right.
#
# The tour potential is the shortest remaining route: from here, through every fruit
# left, to the princess. Every complete route earns the same shaping (9.60), so the
# order is decided by the fruit and princess rewards, which shrink as the bonus counts
# down, and the shortest route wins. Locally it pays +0.40 for going to F2 first.
#
# Distance stays plain px. Measured on L1 (no policy): a ladder px and a floor px take
# the same time (3.2-3.6 vs 3.17 px/step), and ladders are 2-3x more dangerous than the
# floor beside them -- but the shortest route is also the safest (4 ladders, the
# minimum; blind survival 0.048 vs 0.007 for l1_v17's 8), so weighting ladders would
# point the shaping the same way. Scale stays 0.01, so the per-step pull is smaller
# than the sum's; that is part of the lever, not a second one.
#
# READ IT ON: as l1_v21 -- 300-episode re-measures, princess rate and fruit order.
# ============================================================================
training:
  timesteps: 10_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l1_v22_tour_cold_10m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max
reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 1
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    route_potential: true
ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 4
  fruit_presence_addrs:
    1: 12205
    2: 12032
    3: 11880
    4: 11736
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
