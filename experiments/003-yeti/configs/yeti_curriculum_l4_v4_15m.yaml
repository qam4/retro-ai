# L4 v4 — fix the poisoned start pools. ONE lever vs v3.
#
#   admit_requires_survival: true
#
# THE BUG. Snapshot admission (_admit_by_play) keeps a state if the producing
# episode either survived >= min_survival_steps from it OR "reached the next
# target". That second test is `_max_cp_this_ep > start_level`, computed over the
# WHOLE episode -- so a snapshot taken AFTER the episode's deepest point inherits
# credit for progress that happened BEFORE it. Once the agent starts getting
# deep, every late capture rides on earlier progress and the survival gate stops
# filtering anything.
#
# MEASURED ON v3's POOLS (20 sampled states each, death flag 0x2AFC == 65 read
# straight out of the saved bytes, then 60 NOOP steps from a load):
#   Lfruit_top      0/20 dead-flagged    0/20 doomed     clean
#   Step            0/20 dead-flagged    0/20 doomed     clean
#   Lclimb3_top     5/20 dead-flagged   20/20 doomed     POISONED
#   Low1_launch     3/20 dead-flagged   20/20 doomed     POISONED
# The corruption begins exactly where the episode's deepest point starts landing
# before the capture, which is the signature of the inherited credit.
#
# So v3's two new frontier pools are corpses. Every episode seeded there is dead
# on arrival, which caps those starts at ~0 return no matter how much budget the
# allocator sends them -- and v3's whole point was to send them more.
#
# WHY SURVIVAL-ONLY, and what we did NOT do. The alternative is to keep
# reached_next but anchor it to the snapshot (compare max rung at the END of the
# episode against max rung at SAVE TIME, so only progress made AFTER the capture
# counts). That is the more faithful reading and it preserves the leniency that
# sparse rungs were given on purpose in approach 30. It needs a new per-snapshot
# field threaded through save_scored / save_waypoint / the deferred-capture
# buffer, whereas survival-only is a one-line change to a signal we already have
# -- and survival is the property a start pool actually needs. Recorded in
# _admit_by_play so it is not rediscovered; revisit if survival-only starves the
# sparse rungs.
#
# POOLS START EMPTY, DELIBERATELY. A resumed run loads checkpoints.pkl from
# dirname(resume), so resuming v3's directory would re-import the poisoned pools
# and defeat the fix. The weights are staged alone in l4_v3_weights_only/ (no
# pkl), so v4 keeps v3's POLICY -- Step 0.83, Lclimb3_top 0.45, Low1_launch 0.69
# -- and rebuilds every pool from scratch under the new gate.
#
# WHAT v3 ESTABLISHED (15M, exit 0):
#   Step            0.83   progress 0.00 -> 0.69
#   Lclimb3_top     0.00 -> 0.45     from Step: reach 0% -> 41%
#   Low1_launch     0.69
#   Low1            0.00     (no reward term: branch landing, not mandatory)
#   Lhi_up_top      0.00     high branch never explored; shaping pays
#                            +0.36/step left vs -0.36/step right on f11
#   fruit from reset  93% -> 61%   REGRESSION, budget moved off reset/rung3
#   princess        0
#
# WATCH:
#   * rejected_precarious at Lclimb3_top / Low1_launch -- should be large early,
#     since that is the fix doing its job.
#   * whether those pools fill at all under the stricter gate. If they stay empty
#     the wall is survival at the capture point, not allocation, which is a
#     different and more useful problem than v3 left us with.
#   * fruit-from-reset recovering off 61%.

training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v4_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  # v3's weights ONLY -- staged in a directory with no checkpoints.pkl so the
  # poisoned pools are not inherited. See the note above.
  resume: output/mo5/yeti/training/l4_v3_weights_only/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  # Single fruit, so the remaining-counter IS the presence predicate.
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  split_mandatory_starts: true
  earned_progress_score: true
  # THE ONE LEVER vs v3.
  admit_requires_survival: true
