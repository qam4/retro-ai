# Smoke test for segment_4toP_v2: verifies the new princess detection
# rule and the enriched seed pool work end-to-end with the training
# pipeline. 50k steps, no warm-start (we want to see if the user's
# seed produces touches even from scratch).

training:
  timesteps: 50_000
  output: output/mo5/yeti/training/segment_4toP_v2_smoke
  num_envs: 8
  seed: 42

env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_universal
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

segment:
  checkpoints: output/mo5/yeti/seeds/v9_v5_cp4_user_seed.pkl
  segment: 4
