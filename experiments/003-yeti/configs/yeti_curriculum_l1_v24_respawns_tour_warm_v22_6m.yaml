# ============================================================================
# L1 v24 -- RESPAWN ROOT POOL on the tour recipe. WARM from l1_v22, 6M, seed 42.
# ONE lever vs l1_v23: curriculum.root_pool (the l1_r1 TRAIN split: 21 snowball
# sequences, 185 states, plus the plain reset as a 22nd; 10 sequences held out).
#
# WHY AGAIN. v19 tried this lever on l1_v17 and lost the princess everywhere (0/30 on
# every snapshot). That route, F1 -> F3 -> F4 -> F2, ended with three climbs back up,
# and on new sequences it almost never collected F2 (3% of respawn starts reached all
# four fruits). l1_v22 takes F1 -> F2 -> F3 -> F4: the last fruit is 64 px from the
# foot of the last ladder, and on the held-out sequences it already collects all four
# in 44/300 episodes (l1_v17: 0) -- then dies, mostly on floor 4 waiting to climb.
# v22's own F4 pool is 100 states from ~21 snowball pictures, all descended from the
# reset sequence; respawn starts are what can widen it.
#
# KNOWN RISK, as for v19: the referee's champion check compares the reset with
# l1_v22's 232/300, so a snapshot that trades reset play for respawn play is refused.
# All per-snapshot results stay in sweep_state.json either way.
#
# READ IT ON: as l1_v23, plus the share of F4-pool states from distinct snowball
# pictures at the end.
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l1_v24_respawns_tour_warm_v22_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l1_v22_tour_cold_10m/snapshots/model_10000000_steps.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l1_v22_tour_cold_10m/checkpoints.pkl
env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max
reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 1
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    route_potential: true
ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 4
  fruit_presence_addrs:
    1: 12205
    2: 12032
    3: 11880
    4: 11736
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
  root_pool: experiments/003-yeti/data/respawns/l1_r1.json
