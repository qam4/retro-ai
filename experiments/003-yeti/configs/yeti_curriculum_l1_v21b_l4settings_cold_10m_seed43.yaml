# ============================================================================
# L1 v21b -- REPLICATE of l1_v21 (cold control on L4's settings, 10M), seed 43.
#
# Identical to yeti_curriculum_l1_v21_l4settings_cold_10m except the seed and the
# output folder. The threaded env is not reproducible across processes, so a run is a
# replicate whatever its seed; 43 just makes that explicit.
#
# WHY. v21 read 148-162/300 from reset on its three best snapshots, against 219/300 for
# l1_v17 -- the same recipe, cold, on the OLD settings (lives death, 1000 / 15). The
# measured reward difference between the settings is one step's shaping on the ~40% of
# L1 deaths that happen in a surface pose (60 deaths probed), which does not obviously
# explain a gap that size. One run each cannot separate a bad run from the settings.
#
# READ IT ON: the three best snapshots re-measured at 300 episodes from reset, against
# v21's 162 and l1_v17's 219. Near 219: v21 was a bad run, and the two give L1's first
# run-to-run spread. Near 162 again: next is an old-settings replicate of l1_v17.
# ============================================================================
training:
  timesteps: 10_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l1_v21b_l4settings_cold_10m_seed43
  num_envs: 8
  seed: 43
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max
reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 1
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 4
  fruit_presence_addrs:
    1: 12205
    2: 12032
    3: 11880
    4: 11736
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
