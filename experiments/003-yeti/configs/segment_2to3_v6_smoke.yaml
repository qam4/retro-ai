training:
  timesteps: 50_000
  output: output/mo5/yeti/training/segment_2to3_v6_smoke
  num_envs: 2
  seed: 42

env:
  profile: yeti_fruit
  action_mode: joystick
  max_steps: 1000
  stall_threshold: 15
  resize: [84, 84]

reward:
  name: fruit_bonus_climb_novelty
  params:
    scale: 0.01
    climb_bonus: 2.0

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

segment:
  checkpoints: output/mo5/yeti/seeds/v9_checkpoints_v2.pkl
  segment: 2
