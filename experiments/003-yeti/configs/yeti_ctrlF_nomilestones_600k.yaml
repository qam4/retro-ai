# CONTROL F — do the MILESTONES still earn their keep, with the SUM unchanged?
#
# ONE lever vs v15: reward.params.drop_milestones. Warm-started from the v15 champion
# with v15's pools, so a fair replacement should HOLD the chain, not rebuild it.
# The 12 mandatory-waypoint reward terms go away;
# the potential shape, the scale and the whole curriculum are v15's. Milestones stay
# graph nodes and curriculum seeds -- only their reward term goes.
#
# Why this is the ONLY question left. The "route potential" idea turned out to be a
# no-op on L3 and L4: with a single fruit the tour is d(pos->fruit) +
# d(fruit->princess), and the second term is CONSTANT, which PBRS cancels. Verified
# identical shaping to 9 decimals. So everything the earlier tour analysis measured
# came from removing the milestone terms, not from the tour. The tour only differs
# with >= 2 fruits (L1, L2), both already solved.
#
# Reason to expect a drop: v11 measured that ADDING these milestones helped the
# A1..A5 ascent. Reason to expect no drop: the static slope check said the milestone
# sum is the noisier signal on that same stretch (16 down / 1 flat / 3 up, versus
# 19 / 0 / 1 for the milestone-free potential).
#
# scale stays 0.01 -- v15's value. Control D moved scale to 0.06 AND dropped
# milestones, so its 80%->53% decline was unattributable. Do not repeat that.
#
# PASS: princess-from-reset stays near v15's 80% => the milestone reward terms are
#       not doing the work, and L4 can drop them instead of needing a phase gate.
# FAIL: it declines like control D did => the milestones ARE load-bearing, keep them,
#       and L4 keeps the phase gate that is already committed.
#
# 600k answers PRESERVATION only, same as controls A and C.
#   python3 scripts/mo5/yeti/smoke_train.py \
#     --check-log output/mo5/yeti/training/yeti_ctrlF_nomilestones_600k/output.log \
#     --min-chain 12

training:
  timesteps: 600_000
  output: output/mo5/yeti/training/yeti_ctrlF_nomilestones_600k
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true
    # THE LEVER: drop the mandatory-waypoint term, keep the SUM potential and
    # v15's scale. If v15's 80% survives this, the milestones were not doing the
    # work; if it drops, they were. Isolates removal from the potential shape.
    drop_milestones: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
