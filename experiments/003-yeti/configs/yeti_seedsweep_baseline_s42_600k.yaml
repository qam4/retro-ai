# BASELINE — no change, to measure the natural variance
#
# Exactly v15's configuration, warm-started. Any spread here is noise, not effect.
#
# THREE SEEDS PER CONDITION, plus a no-change BASELINE. A single 600k run cannot
# judge this: v15 oscillates with a ~700k period, and 3 of its 25 sliding 600k
# windows read below 5% princess purely by phase. So one sample near zero is ~12%
# likely by chance -- which is how control G first looked like a collapse.
#
# Conditions: baseline (no change) | G (split_mandatory_starts) | H
# (earned_progress_score). All warm-started from the v15 champion with its pools.
# Compare MEANS and SPREADS across seeds, never single runs.

training:
  timesteps: 600_000
  output: output/mo5/yeti/training/yeti_seedsweep_baseline_s42_600k
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true
    # THE LEVER: drop the mandatory-waypoint term, keep the SUM potential and
    # v15's scale. If v15's 80% survives this, the milestones were not doing the
    # work; if it drops, they were. Isolates removal from the potential shape.

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
