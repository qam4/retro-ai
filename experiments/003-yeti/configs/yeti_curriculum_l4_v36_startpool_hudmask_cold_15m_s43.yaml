# ============================================================================
# L4 v36 -- seed-43 replicate of l4_v34, HUD MASKED (env.mask_top_rows 7). l4_v34's yaml byte for
# byte except `seed` (42 -> 43) and `output`.
#
# WHY. l4_v34 (mask) learned the rope-2 crossing and reached 144/300 on the held-out
# starts; l4_v33 (no mask) never reached the princess in a referee eval. One run per
# arm, and the crossing is learned once per run or not at all, so that pair cannot
# separate the mask from luck. Seeds 42/43/44 per arm (l4_v33 / v35 / v37 without,
# l4_v34 / v36 / v38 with) can.
#
# READ IT ON: per run, whether the princess is ever reached in a referee eval and
# the training princess rate by 1M steps; then held-out starts at 300 episodes for
# each arm's best snapshot.
#
# The original l4_v34 header follows unchanged.
# ============================================================================
# ============================================================================
# L4 v34 -- START POOL, COLD, 15M, seed 42, HUD MASKED. ONE lever vs l4_v33:
# env.mask_top_rows 7.
#
# What it does: zeroes raw rows 0-6 of every frame before the resize, the first HUD
# line ("Joueur 1" with its blinking 1, the score, the lives stars). Measured on 27
# l4_v32 episodes, 10150 frames: rows 0-6 change only in those columns, row 7 is never
# non-black, and the agent's sprite top cannot go above row 12. Under 200 -> 84 rows
# 0-6 are output rows 0-2 exactly, so no playfield pixel changes. The second HUD line
# (stage boxes, bonus countdown) stays visible: the countdown is a possible clock cue,
# untested.
#
# WHY. See l4_v33. Policies read the score (l2_v10, l3_v15) and the lives stars
# (l4_v32): another start's HUD pasted in takes them from their own start's rate to
# 0/20. The Atari DQN work cropped the score area for the same kind of reason. Masking
# rather than cropping keeps the input geometry, so the run is comparable with l4_v33
# pixel for pixel below row 7.
#
# THE REFEREE SCORES THE SAME PICTURE. keep_best_sweep --config builds the eval env
# from this file's env section (Registry.config_eval_settings), so the mask applies in
# every referee eval and every registry eval. A hand-typed eval_from_reset run without
# --config / --policy does not apply it.
#
# READ IT ON: held-out starts against l4_v33 and l4_v32 (124/300). One run per arm, so
# only a large difference counts.
# ============================================================================
training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v36_startpool_hudmask_cold_15m_s43
  num_envs: 8
  seed: 43
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: max
  # THE LEVER vs l4_v33.
  mask_top_rows: 7

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    mark_airborne: true
    pay_on_target_change: true
    ladder_segment_shaping: true
    carry_pose_bonus: 1.0
    carry_pose_ids: [15]

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.01
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
  waypoint_reach_mode: sprite
  root_pool: experiments/003-yeti/data/start_pools/l4_p1.json
