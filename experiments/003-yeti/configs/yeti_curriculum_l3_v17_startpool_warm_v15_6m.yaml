# ============================================================================
# L3 v17 -- START POOL. WARM from l3_v15, 6M, seed 42.
# ONE lever vs l3_v16: curriculum.root_pool, L3's registered start pool (l3_p1, TRAIN
# split: 36 hazard sequences, 91 states -- entries of L3 after l2_v10 finished L2 at
# different moments, and respawns -- plus the level start as one more sequence; 18
# sequences held out for scoring).
#
# WHY. l3_v15 reaches the princess 246/300 from its level start and 0/300 on the
# held-out starts, with no fruit in any episode: it plays the one start it trained on.
# Not the moment control is handed over (the pool states give control at the first or
# second step, the level start at the eleventh; with those steps skipped l3_v15 still
# scored 18/20). On L1 the same lever (l1_v24, from l1_v22) gave the first non-zero
# held-out result, 16/300, and lost the plain reset.
#
# Settings as l3_v16 (L4's reach test, l3_v15's resize mode).
#
# READ IT ON: as l3_v16. The referee scores L3 on its held-out starts only, against
# l3_v15's held-out rate.
# ============================================================================
training:
  timesteps: 6_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l3_v17_startpool_warm_v15_6m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 250_000
  route_table_freq_steps: 50_000
  resume: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/final_model.zip
  warmstart_weights_only: true
  resume_pools: output/mo5/yeti/training/yeti_curriculum_l3_v15_gatewp_15m/checkpoints.pkl

env:
  profile: yeti_fruit_level3
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]
  resize_mode: nearest

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 3
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level3/level3_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  waypoint_reach_mode: sprite
  root_pool: experiments/003-yeti/data/start_pools/l3_p1.json
