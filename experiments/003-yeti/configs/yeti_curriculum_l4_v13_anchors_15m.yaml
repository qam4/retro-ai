# L4 v13 — 15M. First full run carrying every fix that is measured-correct, and the
# run that produces a CHAMPION for current code.
#
# Identical to v12's config except the output path. What differs is the CODE, which now
# carries three things v12 did not:
#
#   dc8e5a0  censused anchors: Rope1 27->25, Spring 48->51, Step 60->66. Step's tol-2
#            reward box fired on 0.00 of episodes before this -- a MANDATORY milestone that
#            had never been markable since v4, so its distance term never switched off.
#   9802fbe  Low2_launch px 184 -> 188 and Low1 px 232 -> 224. px 184 is floor 12's tile
#            edge and is LETHAL (0/8 survive a NOOP hold; px 188 survives 8/8). This fix
#            shipped once in e667206 and was lost when that commit was reverted wholesale;
#            the comment kept asserting it while the code did not contain it.
#   f069429  the predecessor reach gate, already in v12.
#
# `admit_requires_grounded` is OFF: measured at 3 seeds x 2M with no effect on pool
# composition, and its behaviour is not understood (see H-AW). Not enabled.
#
# WHY 15M AND ONE SEED, when the standing rule is 3 seeds at the decision length: this run
# is not testing a hypothesis, it is producing an ARTIFACT. There is no champion for
# current code -- v6's was built at bc85424, before all three fixes. Judge it as a
# DISTRIBUTION over snapshots (keep_best_sweep), against v6's n=150 sweep: mean 6.37,
# median 7.88, max 10.00, >=9.5 in 8/150, <1.0 in 10/150.
#
# READ IT HONESTLY. v6 seed 42 is a 1-in-4 outlier -- its own code on seeds 44/45/46 gives
# P(Low1 | Lclimb3_top) of 0.07 / 0.02 / 0.07 against seed 42's 0.81 -- so beating v6's
# distribution is a high bar that a single seed may miss for reasons unrelated to the code.
# A result at or near v6 is a PASS for "current code is not worse"; only a repeated,
# multi-seed win is evidence of "better".
#
# DO NOT expect rope 2. Floor 13 has been touched 24 times in the project's history and
# never seeded from. From the corrected px 188 the crossing IS achievable -- 40 crossings in
# 3312 scripted trials, 'jumpL held', departure waits 17-23, on 6/6 seeds -- but that is a
# ~5-frame window in ~46, and the comparable ladder-3 timing skill is still only learned in
# about 1 run in 4.
training:
  timesteps: 15_000_000
  output: output/mo5/yeti/training/yeti_curriculum_l4_v13_anchors_15m
  num_envs: 8
  seed: 42
  snapshot_freq_steps: 100_000
  route_table_freq_steps: 50_000
  # v4's weights AND v4's pools (checkpoints.pkl is loaded from dirname(resume)).
  resume: output/mo5/yeti/training/yeti_curriculum_l4_v4_15m/final_model.zip
  warmstart_weights_only: true

env:
  profile: yeti_fruit_level4
  action_mode: joystick
  max_steps: 1500
  stall_threshold: 40
  resize: [84, 84]

reward:
  name: fruit_bonus_path_progress_pbrs_grounded
  params:
    scale: 0.01
    fruit_scale: 0.01
    princess_scale: 0.05
    level: 4
    gamma: 1.0
    defer_fruit_credit: true
    waypoint_reward_tol: 2
    ladder_segment_shaping: true

ppo:
  learning_rate: 3.0e-4
  batch_size: 64
  n_steps: 512
  n_epochs: 4
  ent_coef: 0.02
  clip_range: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.07

curriculum:
  reset_fraction: 0.0
  frontier_fraction: 0.0
  earlier_fraction: 0.0
  max_states_per_checkpoint: 100
  min_states_to_advance: 20
  min_survival_steps: 30
  reach_threshold: 0.15
  segment_floor: 0.0
  fruits_total: 1
  fruit_presence_addrs:
    1: 11055
  start_state: output/mo5/yeti/level4/level4_start.sav
  waypoints: true
  waypoint_tolerance: 2
  gate_waypoints: true
  gate_waypoints_by_predecessor: true
  split_mandatory_starts: true
  earned_progress_score: true
  admit_requires_survival: true
