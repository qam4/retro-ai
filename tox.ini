[tox]
envlist = lint, py{310,311}
skip_missing_interpreters = true

[testenv:lint]
description = black + ruff (matches CI lint job)
skip_install = true
deps =
    black>=24.0
    ruff>=0.4.0
commands =
    black --check python/
    ruff check python/

[testenv]
description = pytest (matches CI test-python job)
skip_install = true
deps =
    numpy
    pytest
    pytest-cov
    gymnasium
    pyyaml
setenv =
    PYTHONPATH = {toxinidir}/python
commands =
    pytest tests/python/ -v --tb=short
